name = "nastyplot"
main = "worker/feedback.mjs"
compatibility_date = "2026-11-24"

[assets]
directory = "./app/dist"
binding = "ASSETS"
# "404-page" (Nov 25, SEO): an unknown address gets dist/404.html with status 404, not the page with 200 (a soft 404);
# each tool address has its own rule in dist/_redirects; .html files are served without .html (html_handling default)
not_found_handling = "404-page"
run_worker_first = ["/api/feedback", "/data/*"]

[[d1_databases]]
binding = "DB"
database_name = "nastyplot-feedback"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# Rate limiting: configure Cloudflare WAF / Rate Limiting rule on POST /api/feedback (e.g. 5 req / min)
# in the Cloudflare dashboard (Cloudflare enforces it at the edge without our Worker storing IPs).
