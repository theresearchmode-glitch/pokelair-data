name = "nastyplot"
main = "worker/feedback.mjs"
compatibility_date = "2026-11-24"
# Only nastyplot.org serves the site: no *.workers.dev copy and no preview addresses, so search engines never see a duplicate
# site (SEO audit Nov 25 #4).
workers_dev = false
preview_urls = false

[assets]
directory = "./app/dist"
binding = "ASSETS"
# "404-page" (Nov 25, SEO): an unknown address gets dist/404.html with status 404, not the page with 200 (a soft 404);
# each tool address has its own rule in dist/_redirects; .html files are served without .html (html_handling default)
not_found_handling = "404-page"
# Only the feedback API runs the Worker. /data/* are plain static files: on the Free plan every Worker request counts toward
# 100,000 a day and a visit loads about 17 data files, so routing /data/* through the Worker capped us near 5,800 visits a day
# (launch review Nov 25, C). A missing data file is a 404 from the assets setting; the page treats any non-OK answer as "not found".
# /api/count (Nov 25): the anonymous Team check counter (a daily total in D1 table counts; worker/feedback-lib.mjs). About one
# Worker request per scored six, so it barely touches the 100,000 a day.
run_worker_first = ["/api/feedback", "/api/count"]

# Feedback rate limit inside the Worker (Nov 25): the free plan's one WAF rate-limit rule is Cloudflare's leaked-credential check
# (Dos's Cloudflare setup), so /api/feedback is limited here: 5 messages per 60 s per sender, per Cloudflare location.
[[ratelimits]]
name = "FEEDBACK_RL"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

# Team-check counts (Kip job 34 #4): 30 per 60 s per sender, so a script can't inflate them or burn the daily Worker quota
[[ratelimits]]
name = "COUNT_RL"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 30
  period = 60

[[d1_databases]]
binding = "DB"
database_name = "nastyplot-feedback"
database_id = "6a292fdc-4a06-4871-966a-0db608333206" # created by Sim + Dos, Nov 25 (an id, not a secret)

# Rate limiting: configure Cloudflare WAF / Rate Limiting rule on POST /api/feedback (e.g. 5 req / min) and POST /api/count (e.g. 30 req / min)
# in the Cloudflare dashboard (Cloudflare enforces it at the edge without our Worker storing IPs).
