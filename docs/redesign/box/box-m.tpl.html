<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NastyPlot My Box concept, iPhone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300..900&family=Instrument+Sans:wght@400..700&display=swap">
<style>
:root{--bg:#FBFAF7;--ink:#17161A;--ink2:#48454F;--ink3:#66636E;--rule:rgba(23,22,26,.11);--plot:#0078BF;--u:"Unbounded",system-ui,sans-serif;--b:"Instrument Sans",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--b);-webkit-font-smoothing:antialiased;font-synthesis:style}
.page{width:390px;overflow:hidden;position:relative}
.u{font-family:var(--u);font-style:italic;font-weight:900;letter-spacing:-.02em}
header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}header .logo svg{height:32px;display:block}header .ic{display:flex;gap:20px}
.pad{padding:0 20px}
.eyebrow{display:flex;align-items:center;gap:9px;font:600 13px/1 var(--b);letter-spacing:.04em;color:var(--ink2);margin-top:8px}
.eyebrow::before{content:"";width:18px;height:6px;background:var(--plot);transform:skewX(-24deg)}
.hd{display:flex;align-items:baseline;justify-content:space-between;margin-top:12px}.hd h1{font-size:34px;line-height:1}.hd span{font:600 14px/1 var(--b);color:var(--ink2)}
.note{font-size:14px;color:var(--ink2);line-height:1.45;margin-top:10px}
.add{display:flex;align-items:center;height:50px;padding:0 18px;margin:16px 6px 0;border:1.5px solid var(--ink);font:500 15px/1 var(--b);color:var(--ink3);transform:skewX(-10deg)}.add span{transform:skewX(10deg)}.add b{margin-left:auto;font:800 20px/1 var(--u);color:var(--ink);transform:skewX(10deg)}
.sort{display:flex;gap:6px;margin:14px -20px 0 0;overflow:hidden}
.sort small{flex:none;align-self:center;font-size:13px;color:var(--ink3);margin-right:4px}
.sort span{flex:none;height:36px;padding:0 15px;display:flex;align-items:center;font:600 14px/1 var(--b);border-radius:999px;background:rgba(128,124,136,.14);color:var(--ink2)}.sort span.on{background:var(--ink);color:var(--bg)}
/* the box */
.box{position:relative;margin:18px 8px 0;border-radius:18px;overflow:hidden;padding:0 6px 16px}
.box .wall{position:absolute;inset:0}
.box .rays{position:absolute;inset:-30%;background:repeating-conic-gradient(from 6deg at 50% 46%,rgba(255,255,255,.34) 0 1.4deg,transparent 1.4deg 12deg);-webkit-mask-image:radial-gradient(closest-side,transparent 30%,#000 70%,transparent 100%)}
.bar{position:relative;z-index:2;height:66px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;text-align:center;padding:0 8px}
.bar .ar{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.78);display:grid;place-items:center;font:800 15px/1 var(--u)}
.bar h2{font-size:20px}.bar small{display:block;font:500 13px/1 var(--b);font-style:normal;letter-spacing:0;color:var(--ink2);margin-top:5px}
.grid{position:relative;z-index:2;display:grid;grid-template-columns:repeat(5,1fr)}
.cell{position:relative;height:104px;text-align:center}
.cell img{position:absolute;left:50%;width:70px;height:70px;margin-left:-35px;z-index:2}
.cell .sh{position:absolute;left:50%;top:72px;width:48px;height:8px;margin-left:-24px;border-radius:50%;background:radial-gradient(closest-side,rgba(30,20,50,.3),transparent)}
.cell .n{position:absolute;left:-4px;right:-4px;top:80px;font:500 13px/1.2 var(--b);letter-spacing:-.015em;white-space:nowrap}
.cell .tm{position:absolute;z-index:3;left:50%;margin-left:18px;top:2px;width:16px;height:7px;background:var(--plot);transform:skewX(-24deg)}
.cell.on{z-index:4}.cell.on::before{content:"";position:absolute;left:3px;right:3px;top:-4px;height:84px;border-radius:14px;background:rgba(255,255,255,.85);box-shadow:0 16px 26px -14px rgba(30,20,50,.5)}
.cell.on img{width:82px;height:82px;margin-left:-41px;margin-top:-14px}.cell.on .n{font-weight:700}
.dots{position:relative;z-index:2;display:flex;justify-content:center;gap:8px;margin-top:8px}.dots i{width:22px;height:6px;background:rgba(23,22,26,.25);transform:skewX(-24deg)}.dots i.on{background:var(--ink)}
/* selected: slides up from the bottom when you tap */
.sum{position:relative;margin:14px 8px 0;border-radius:18px 18px 0 0;padding:10px 16px 18px;border:1px solid var(--rule);border-bottom:0;box-shadow:0 -14px 30px -22px rgba(30,20,50,.45)}
.sum .grab{width:40px;height:5px;border-radius:3px;background:var(--rule);margin:0 auto 12px}
.sum .top{position:relative;display:grid;grid-template-columns:118px 1fr;gap:14px;align-items:center}
.sum .pn{position:absolute;left:0;top:10px;width:112px;height:92px;transform:skewY(-7deg);border-radius:6px;overflow:hidden}
.sum .pn::after{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(from 8deg at 50% 62%,rgba(255,255,255,.5) 0 2deg,transparent 2deg 16deg)}
.sum img{position:relative;width:118px;height:118px}
.sum h3{font-size:24px;line-height:1.05}
.ty{display:inline-block;font:700 13px/1 var(--b);padding:4px 10px;border-radius:999px;color:#fff;margin:8px 4px 0 0}
.plate{display:inline-flex;align-items:center;height:30px;padding:0 14px;margin-top:10px;background:var(--ink);color:var(--bg);font:800 13px/1 var(--u);font-style:italic;white-space:nowrap;clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%)}
.three{display:grid;grid-template-columns:repeat(3,auto);justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)}
.three b{display:block;font:500 22px/1.1 var(--u);font-style:italic;letter-spacing:-.04em}.three span{display:block;font-size:13px;color:var(--ink2);margin-top:3px}
.acts{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px;margin-top:16px}
.pill{display:flex;align-items:center;justify-content:center;height:50px;background:var(--ink);color:var(--bg);font:800 13px/1 var(--u);font-style:italic;white-space:nowrap;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.ghost{display:flex;align-items:center;justify-content:center;height:50px;border:1.5px solid var(--ink);font:600 14px/1 var(--b);white-space:nowrap;transform:skewX(-10deg)}.ghost b{font-weight:600;transform:skewX(10deg)}
/* team + links */
.ph{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 4px}.ph b{font-size:17px}.ph span{font-size:13px;color:var(--ink2)}
.prow{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--rule);padding-top:8px}
.prow div{text-align:center;font:600 13px/1 var(--b);color:var(--ink2)}.prow img{width:56px;height:56px;display:block;margin:0 auto 2px}
.mini{padding:14px 0;border-top:1px solid var(--rule);display:flex;justify-content:space-between;font-size:15px;font-weight:600}.mini span{color:var(--ink3);font-weight:500}
.fine{font-size:13px;color:var(--ink3);line-height:1.45;margin-top:12px}
footer{margin-top:24px;padding:22px 20px 36px;border-top:1px solid var(--rule);font-size:14px;color:var(--ink2);line-height:1.6}footer svg{height:26px;display:block;margin-bottom:10px}
</style></head><body><div class="page">
<header><div class="logo">%LOGO%</div><div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8h16M4 16h16"/></svg></div></header>
<div id="main"></div>
<footer>%LOGO2%NastyPlot is an unofficial, fan-made tool.<br>How scoring works · About · Send feedback</footer>
</div><script>
/*DATA*/
const TY={Dragon:'#5060E1',Ground:'#9A6230'};
function hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let h=0,s=0;if(d){s=d/(1-Math.abs(2*l-1));h=mx==r?((g-b)/d)%6:mx==g?(b-r)/d+2:(r-g)/d+4;h=(h*60+360)%360;}return[h,s,l];}
async function meta(src){const im=new Image();im.src=src;await im.decode();const S=64,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');x.drawImage(im,0,0,S,S);const d=x.getImageData(0,0,S,S).data,B=Array.from({length:18},()=>[0,0,0,0]);let y1=0;
  for(let i=0;i<d.length;i+=4){if(d[i+3]<60)continue;y1=Math.max(y1,Math.floor(i/4/S));if(d[i+3]<200)continue;const[h,s,l]=hsl(d[i],d[i+1],d[i+2]);if(s<.28||l<.2||l>.86)continue;const b=B[Math.floor(h/20)%18],w=s*s;b[0]+=d[i]*w;b[1]+=d[i+1]*w;b[2]+=d[i+2]*w;b[3]+=w;}
  const o=B.map((b,i)=>({i,w:b[3],c:b[3]?b.slice(0,3).map(v=>Math.round(v/b[3])):[205,205,215]})).sort((a,b)=>b.w-a.w),a=o[0],b2=o.find(q=>q.w>a.w*.12&&Math.min(Math.abs(q.i-a.i),18-Math.abs(q.i-a.i))>=3)||a;return{a:a.c,b:b2.c,bot:(y1+1)/S};}
const rgb=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
(async()=>{
  const M={};await Promise.all(D.box.map(async m=>{M[m.n]=await meta(m.img);}));
  const first=D.box.slice(0,30),sel=D.box.find(m=>m.n===D.sel),k=M[sel.n],pick=i=>M[first[i].n].a;
  const wall=`radial-gradient(70% 50% at 10% 10%,${rgb(pick(1),.5)},transparent),radial-gradient(70% 50% at 90% 12%,${rgb(pick(5),.5)},transparent),radial-gradient(70% 50% at 12% 90%,${rgb(pick(24),.48)},transparent),radial-gradient(70% 50% at 90% 88%,${rgb(pick(13),.48)},transparent),linear-gradient(#F4F0EA,#F4F0EA)`;
  const cells=first.map(m=>`<div class="cell ${m.n===D.sel?'on':''}"><i class="sh"></i><img src="${m.img}" style="top:${74-70*M[m.n].bot}px">${m.team?'<i class="tm"></i>':''}<div class="n">${m.d}</div></div>`).join('');
  document.getElementById('main').innerHTML=`
  <div class="pad"><div class="eyebrow">My team · The Pokémon you own</div>
    <div class="hd"><h1 class="u">My Box</h1><span>${D.box.length} Pokémon · 2 boxes</span></div>
    <p class="note">Build for me and the suggestions pick from these when set to "My box".</p>
    <div class="add"><span>Add a Pokémon</span><b>+</b></div>
    <div class="sort"><small>Arrange by</small><span class="on">A–Z</span><span>Type</span><span>Newest</span><span>Oldest</span><span>Rating</span></div></div>
  <div class="box"><div class="wall" style="background:${wall}"></div><div class="rays"></div>
    <div class="bar"><span class="ar">◀</span><div><h2 class="u">Box 1</h2><small>30 of ${D.box.length} · A to S · swipe for Box 2</small></div><span class="ar">▶</span></div>
    <div class="grid">${cells}</div><div class="dots"><i class="on"></i><i></i></div></div>
  <div class="sum"><div class="grab"></div>
    <div class="top"><i class="pn" style="background:linear-gradient(150deg,${rgb(k.a,.85)},${rgb(k.b,.7)})"></i><img src="${sel.img}"><div><h3 class="u">${sel.d}</h3><div>${sel.t.map(t=>`<span class="ty" style="background:${TY[t]}">${t}</span>`).join('')}</div><span class="plate">Rated ${sel.r} · ${sel.tier}</span></div></div>
    <div class="three"><div><b>${sel.u}%</b><span>of teams</span></div><div><b>${sel.w}%</b><span>win rate</span></div><div><b>${sel.sp}</b><span>base Speed</span></div></div>
    <div class="acts"><span class="pill">Info sheet ➜</span><span class="ghost"><b>Swap in</b></span><span class="ghost"><b>Remove</b></span></div></div>
  <div class="pad"><div class="ph"><b>Your team</b><span>6 of 6 · hold and drag to swap</span></div>
    <div class="prow">${D.team.map(m=>`<div><img src="${m.img}">${m.role}</div>`).join('')}</div>
    <div style="margin-top:22px"><div class="mini">Copy box link<span>›</span></div><div class="mini">Open a box link<span>›</span></div><div class="mini" style="border-bottom:1px solid var(--rule)">Reset box<span>›</span></div></div>
    <p class="fine">Saved in this browser only: this device isn't connected to your account.</p>
    <p class="fine"><i style="display:inline-block;width:16px;height:7px;background:var(--plot);transform:skewX(-24deg);margin-right:8px"></i>On your team</p></div>`;
  document.body.dataset.ready=1;
})();
</script></body></html>
