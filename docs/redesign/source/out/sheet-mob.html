<!doctype html><html lang="en"><head><meta charset="utf-8"><title>NastyPlot info sheet concept</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300..900&family=Instrument+Sans:wght@400..700&display=swap">
<style>
:root{--bg:#FBFAF7;--ink:#17161A;--ink2:#48454F;--ink3:#66636E;--rule:rgba(23,22,26,.11);--plot:#0078BF;--ok:#16693B;--bad:#B81E3A;--u:"Unbounded",system-ui,sans-serif;--b:"Instrument Sans",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#17161A;color:var(--ink);font:400 15px/1.45 var(--b);-webkit-font-smoothing:antialiased;font-synthesis:style}
.u{font-family:var(--u);font-style:italic;font-weight:900;letter-spacing:-.02em}
.behind{position:absolute;inset:0;background-size:100% auto;background-position:top center;background-repeat:no-repeat;filter:blur(5px) brightness(.5) saturate(.8)}
.sheet{position:relative;background:var(--bg);overflow:hidden}
.x{position:absolute;z-index:6;width:44px;height:44px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:20px;box-shadow:0 6px 18px -8px rgba(30,20,50,.5)}
/* hero side */
.panel{position:absolute;transform:skewY(-7deg);border-radius:6px;overflow:hidden}
.panel::after{content:"";position:absolute;inset:-40%;background:repeating-conic-gradient(from 8deg at 55% 62%,rgba(255,255,255,.5) 0 1.6deg,transparent 1.6deg 15deg);-webkit-mask-image:radial-gradient(closest-side,transparent 22%,#000 58%,transparent 96%)}
.art{position:absolute;z-index:2}
.rate{position:absolute;z-index:3;line-height:.82;letter-spacing:-.05em}
.plate{position:absolute;z-index:4;height:38px;padding:0 20px;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);font:800 13px/1 var(--u);font-style:italic;white-space:nowrap;clip-path:polygon(11px 0,100% 0,calc(100% - 11px) 100%,0 100%)}
.plate i{font-style:normal;color:#FF4D6D}
.name{line-height:1.05}
.ty{display:inline-block;font:700 13px/1 var(--b);padding:5px 11px;border-radius:999px;color:#fff;margin-right:5px}
.tag{display:inline-block;font:600 13px/1 var(--b);padding:5px 11px;border-radius:999px;border:1.5px solid var(--ink);margin-right:5px}
.three{display:grid;grid-template-columns:repeat(3,auto);justify-content:space-between;gap:10px}
.three b{display:block;font:500 28px/1.1 var(--u);font-style:italic;letter-spacing:-.04em}.three span{display:block;font-size:14px;font-weight:600;margin-top:4px}.three small{display:block;font-size:13px;color:var(--ink3)}
.pill{display:flex;align-items:center;justify-content:center;height:52px;padding:0 24px;background:var(--ink);color:var(--bg);font:800 14px/1 var(--u);font-style:italic;white-space:nowrap;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.ghost{display:flex;align-items:center;justify-content:center;height:52px;padding:0 12px;white-space:nowrap;border:1.5px solid var(--ink);font:600 15px/1 var(--b);transform:skewX(-12deg)}.ghost b{font-weight:600;transform:skewX(12deg)}
/* tabs */
.jump{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px;border:1px solid var(--rule)}
.jump span{height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:800 14px/1 var(--u);font-style:italic;color:var(--ink2);clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%)}
.jump span small{font:500 13px/1 var(--b);font-style:normal}
.jump span.on{background:var(--ink);color:var(--bg)}
/* blocks */
.sh{display:flex;align-items:center;gap:12px;margin-bottom:12px}.sh i{width:22px;height:8px;background:var(--c,var(--plot));transform:skewX(-24deg)}.sh h3{font-size:19px;line-height:1.1}
.usual{padding:16px 18px;border-left:5px solid var(--acc);background:var(--tint)}.usual small{display:block;font-size:13px;color:var(--ink2);margin-bottom:4px}.usual b{font-weight:700}.usual p{color:var(--ink2);margin-top:2px}
.link{font:600 15px/1 var(--b);color:var(--ink);border-bottom:1.5px solid currentColor;padding-bottom:2px;white-space:nowrap}
.stat{display:grid;grid-template-columns:76px 1fr 46px;align-items:center;gap:12px;height:34px;font-weight:500;color:var(--ink2)}
.stat .bar{height:9px;background:var(--rule);transform:skewX(-24deg);position:relative}.stat .bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.stat b{font:500 17px/1 var(--u);font-style:italic;letter-spacing:-.03em;color:var(--ink);text-align:right}
.stat.tot{border-top:1px solid var(--rule);margin-top:4px;color:var(--ink);font-weight:600}
.tm{display:grid;grid-template-columns:86px 1fr;align-items:center;gap:10px;min-height:46px;border-top:1px solid var(--rule)}.tm:first-of-type{border-top:0}
.tm>b{font-weight:700}.tm.w>b{color:var(--bad)}.tm.r>b{color:var(--ok)}.tm.i>b{color:var(--plot)}
.sp{display:grid;grid-template-columns:1fr 62px;gap:2px 12px;padding:11px 0;border-top:1px solid var(--rule)}.sp:first-of-type{border-top:0;padding-top:0}
.sp b{font-weight:700}.sp p{font-size:14px;color:var(--ink2);line-height:1.35}.sp .n{grid-row:1/3;grid-column:2;align-self:center;text-align:right;font:500 24px/1 var(--u);font-style:italic;letter-spacing:-.04em}
.sp .o{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--ok);margin-top:4px}.sp .o i{flex:none;display:block;width:120px;height:6px;background:var(--rule);transform:skewX(-24deg);position:relative}.sp .o i u{position:absolute;left:0;top:0;bottom:0;background:var(--ok)}
.ab{padding:12px 0;border-top:1px solid var(--rule)}.ab:first-of-type{border-top:0;padding-top:0}.ab b{font-weight:700}.ab em{font-style:normal;font-size:13px;font-weight:600;color:var(--plot);margin-left:8px}.ab p{font-size:14px;color:var(--ink2);line-height:1.4;margin-top:2px}
.fine{font-size:13px;color:var(--ink3);line-height:1.4;margin-top:8px}
.blk{margin-top:30px}

/* ---------- desktop ---------- */
body.desk{width:1440px;min-height:900px;position:relative;padding:44px 0 56px}
.desk .sheet{width:1260px;margin:0 auto;border-radius:18px;display:grid;grid-template-columns:420px 1fr;box-shadow:0 40px 90px -30px #000}
.desk .x{right:20px;top:20px}
.desk .hero{position:relative;padding:0 40px 40px;min-height:940px;background:linear-gradient(180deg,var(--tint),transparent 70%)}
.desk .panel{left:34px;right:34px;top:54px;height:330px}
.desk .art{left:118px;top:36px;width:330px;height:330px}
.desk .rate{left:52px;top:150px;font-size:108px}
.desk .plate{left:46px;top:268px}
.desk .id{padding-top:430px}.desk .name{font-size:40px}
.desk .tags{margin:14px 0 26px}.desk .btns{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:28px}
.desk .body{padding:26px 76px 44px 40px}
.desk .jump{width:520px}
.desk .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 48px;margin-top:26px}
/* ---------- phone ---------- */
body.mob{width:390px;position:relative;padding-top:44px}
.mob .sheet{border-radius:18px 18px 0 0;padding-bottom:36px}
.mob .grab{width:40px;height:5px;border-radius:3px;background:var(--rule);margin:10px auto 0}
.mob .x{right:14px;top:14px}
.mob .hero{position:relative;padding:0 20px;background:linear-gradient(180deg,var(--tint),transparent 90%)}
.mob .panel{left:20px;right:20px;top:34px;height:236px}
.mob .art{right:6px;top:22px;width:250px;height:250px}
.mob .rate{left:34px;top:112px;font-size:84px}
.mob .plate{left:28px;top:206px}
.mob .id{padding-top:300px}.mob .name{font-size:32px}
.mob .tags{margin:12px 0 20px}.mob .btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.mob .body{padding:22px 20px 0}
.mob .three b{font-size:24px}
</style></head><body class="mob">

function hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let h=0,s=0;if(d){s=d/(1-Math.abs(2*l-1));h=mx==r?((g-b)/d)%6:mx==g?(b-r)/d+2:(r-g)/d+4;h=(h*60+360)%360;}return[h,s,l];}
async function meta(src){const im=new Image();im.src=src;await im.decode();const S=64,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');x.drawImage(im,0,0,S,S);const d=x.getImageData(0,0,S,S).data,B=Array.from({length:18},()=>[0,0,0,0]);
  for(let i=0;i<d.length;i+=4){if(d[i+3]<200)continue;const[h,s,l]=hsl(d[i],d[i+1],d[i+2]);if(s<.28||l<.2||l>.86)continue;const b=B[Math.floor(h/20)%18],w=s*s;b[0]+=d[i]*w;b[1]+=d[i+1]*w;b[2]+=d[i+2]*w;b[3]+=w;}
  const o=B.map((b,i)=>({i,w:b[3],c:b[3]?b.slice(0,3).map(v=>Math.round(v/b[3])):[205,205,215]})).sort((a,b)=>b.w-a.w),a=o[0],b2=o.find(q=>q.w>a.w*.12&&Math.min(Math.abs(q.i-a.i),18-Math.abs(q.i-a.i))>=3)||a;return[a.c,b2.c];}
const rgb=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`,acc=c=>{const[h,s]=hsl(c[0],c[1],c[2]);return `hsl(${h.toFixed(0)} ${Math.round(Math.max(s,.62)*100)}% 44%)`;};
(async()=>{
  const[a,b]=await meta(D.img),S=document.getElementById('sheet');
  S.style.setProperty('--acc',acc(a));S.style.setProperty('--acc2',acc(b));S.style.setProperty('--tint',rgb(a,.16));
  const chip=t=>`<span class="ty" style="background:${TY[t]}">${t}</span>`;
  const hero=`<div class="hero"><div class="panel" style="background:linear-gradient(150deg,${rgb(a,.85)},${rgb(b,.7)})"></div><img class="art" src="${D.img}"><div class="rate u">${D.r}</div><div class="plate"><i>▲▲</i>${D.tier}, #${D.rank} of ${D.of} with results</div>

  const types=`<div class="blk"><div class="sh" style="--c:var(--acc2)"><i></i><h3 class="u">Type matchups</h3></div>${D.types.map(r=>`<div class="tm ${r[2]}"><b>${r[0]}</b><div>${r[1].map(chip).join('')}</div></div>`).join('')}<p class="fine">For its typing (${D.t.join(' / ')}) alone. Every type not listed hits it for normal damage.</p></div>`;
  const speed=`<div class="blk"><div class="sh"><i></i><h3 class="u">Speed at level 50</h3></div>${D.speed.map(s=>`<div class="sp"><b>${s[0]}</b><span class="n">${s[1]}</span><p>${s[2]}</p><div class="o"><i><u style="width:${s[3]}%"></u></i>${s[4]}</div></div>`).join('')}<p class="fine">Level 50, as in Pokémon Champions: base Speed ${D.stats[5][1]}, Speed points 0–32 add 1 each, a Speed nature adds 10%. <span class="link" style="font-size:13px">Speed tiers</span></p></div>`;
  const abil=`<div class="blk"><div class="sh" style="--c:var(--acc)"><i></i><h3 class="u">Abilities</h3></div>${D.abil.map(x=>`<div class="ab"><b>${x[0]}</b><em>${x[1]}</em><p>${x[2]}</p></div>`).join('')}<p class="fine">Share of players' sets with each ability, in-game ranked battles.</p></div>`;

  document.body.dataset.ready=1;
