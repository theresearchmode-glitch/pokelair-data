<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NastyPlot home concept: iPhone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Instrument+Sans:wght@400..700&display=swap">
<style>
:root{--bg:#FBFAF7;--ink:#17161A;--ink2:#5B5862;--ink3:#8B8892;--rule:rgba(23,22,26,.1);--d:"Bricolage Grotesque",system-ui,sans-serif;--b:"Instrument Sans",system-ui,sans-serif}
html[data-theme=dark]{--bg:#17161C;--ink:#F3F1ED;--ink2:#B8B4C0;--ink3:#8A8693;--rule:rgba(255,255,255,.13)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--b);-webkit-font-smoothing:antialiased}
.page{width:390px;overflow:hidden;position:relative}
section{position:relative}
.wash{position:absolute;border-radius:50%;pointer-events:none;filter:blur(28px)}
.eyebrow{font:500 13px/1 var(--b);letter-spacing:.06em;color:var(--ink3)}
h1,h2,.num,.giant{font-family:var(--d);font-variation-settings:"opsz" 96;letter-spacing:-.04em}
h1{font-size:54px;line-height:.97;font-weight:300}h1 b{font-weight:600;display:block}
h2{font-size:40px;line-height:1.02;font-weight:300}h2 b{font-weight:600}
p.lede{font-size:17px;line-height:1.5;color:var(--ink2)}p.lede b{color:var(--ink);font-weight:600}
.pill{display:inline-flex;align-items:center;justify-content:center;height:54px;padding:0 26px;border-radius:999px;background:var(--ink);color:var(--bg);font:600 16px/1 var(--b)}
.link{font:600 16px/1 var(--b);color:var(--ink);border-bottom:1.5px solid currentColor;padding-bottom:3px}
.txt{position:absolute;z-index:5;left:24px;right:24px}
.txt h2{margin:16px 0 16px}
.mon{position:absolute;display:block}
.shadow{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(30,20,50,.34),transparent);filter:blur(2px)}
[data-theme=dark] .shadow{background:radial-gradient(closest-side,rgba(255,255,255,.22),transparent)}
.cap{position:absolute;z-index:5;font:600 13px/1.25 var(--b);text-align:center;white-space:nowrap;transform:translateX(-50%)}.cap i{font-style:normal;font-weight:500;color:var(--ink3);margin-left:4px}
.cap small{display:block;font:500 13px/1.3 var(--b);color:var(--ink3)}
.floor{position:absolute;left:24px;right:24px;height:1px;background:linear-gradient(90deg,transparent,var(--rule) 12%,var(--rule) 88%,transparent)}
.giant{position:absolute;z-index:1;left:0;right:0;text-align:center;font-weight:700;line-height:.8;letter-spacing:-.06em;-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.note{position:absolute;z-index:5;display:flex;align-items:center;gap:7px;font:500 13px/1 var(--b);color:var(--ink2);white-space:nowrap}
.note::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
header{position:absolute;z-index:9;left:0;right:0;top:0;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.wm{font:700 21px/1 var(--d);letter-spacing:-.04em}.wm span{font-weight:300}
header .ic{display:flex;gap:20px;color:var(--ink)}
/* hero */
.hero{height:1056px}
.hero .ground{position:absolute;left:0;right:0;top:758px;height:200px}
.hero h1{margin:18px 0 18px}
.acts{display:flex;align-items:center;gap:20px;margin-top:22px}
.specs{position:absolute;z-index:5;left:24px;right:24px;top:822px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding-top:16px;border-top:1px solid var(--rule)}
.specs .num{font-size:38px;line-height:1;font-weight:200}.specs .num small{font-size:20px;font-weight:300}
.specs span{display:block;font-size:13px;line-height:1.3;color:var(--ink2);margin-top:6px}
.rail{position:absolute;z-index:5;left:24px;right:-40px;top:944px;display:flex;gap:18px;padding-top:18px;border-top:1px solid var(--rule)}
.rail .it{position:relative;flex:none;display:flex;align-items:center;gap:8px;font:600 14px/1.25 var(--b)}
.rail .im{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(closest-side,var(--c),transparent)}.rail img{width:48px;height:48px}
.rail small{display:block;font:500 13px/1.2 var(--b);color:var(--ink3)}
.rail .it.on::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:2px;background:var(--ink)}
/* grade */
.grade{height:850px;text-align:center}
.badge{position:absolute;z-index:4;width:64px;height:64px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:600 34px/1 var(--d);letter-spacing:-.04em}
.facts{position:absolute;z-index:5;left:24px;right:24px;top:690px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;border-top:1px solid var(--rule);padding-top:16px}
.facts div{font-size:13px;color:var(--ink2);line-height:1.3}.facts b{display:block;font:300 34px/1.05 var(--d);letter-spacing:-.04em;color:var(--ink)}
/* pairs */
.pairs{height:800px}
.plus{position:absolute;z-index:4;width:40px;height:40px;border-radius:50%;background:#fff;color:#17161A;display:grid;place-items:center;font:300 24px/1 var(--d);box-shadow:0 10px 30px -10px rgba(30,20,50,.35)}
[data-theme=dark] .plus{background:#2A2830;color:var(--ink);box-shadow:none}
/* preview */
.prev{height:904px}
.role{position:absolute;z-index:5;left:0;right:0;text-align:center;font:600 13px/1 var(--b);letter-spacing:.06em;color:var(--ink3)}
/* speed */
.speed{height:760px}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:rgba(23,22,26,.06);margin-top:16px}
.seg span{height:36px;padding:0 14px;border-radius:999px;font:600 14px/36px var(--b);color:var(--ink2)}.seg span.on{background:#fff;color:#17161A;box-shadow:0 4px 14px -6px rgba(30,20,50,.3)}
[data-theme=dark] .seg{background:rgba(255,255,255,.08)}[data-theme=dark] .seg span.on{background:#35333C;color:var(--ink);box-shadow:none}
.srow{position:absolute;left:24px;right:24px;height:72px}
.srow .nm{position:absolute;left:84px;top:10px;font:600 15px/1.2 var(--b)}
.srow .bar{position:absolute;left:84px;top:40px;height:3px;border-radius:2px}
.srow .sp{position:absolute;right:0;top:4px;font:200 38px/1 var(--d);letter-spacing:-.04em}
/* week */
.week{height:850px}
.week .v{position:absolute;z-index:5;font:300 28px/1 var(--d);letter-spacing:-.03em;text-align:center;width:120px;margin-left:-60px}
.stem{position:absolute;width:1px;background:var(--ink);opacity:.35}
/* tools */
.tools{padding:20px 24px 40px;border-top:1px solid var(--rule)}
.trow{display:grid;grid-template-columns:64px 1fr 20px;align-items:center;gap:12px;padding:18px 0;border-bottom:1px solid var(--rule)}
.trow img{width:64px;height:64px}.trow h3{font:600 22px/1.1 var(--d);letter-spacing:-.03em}.trow p{font-size:14px;line-height:1.35;color:var(--ink2);margin-top:4px}.trow span{color:var(--ink3);font-size:20px}
footer{padding:26px 24px 48px;font-size:14px;color:var(--ink2);line-height:1.6}footer .wm{font-size:19px;color:var(--ink);margin-bottom:10px}
.tab{position:absolute;z-index:20;left:16px;right:16px;height:64px;border-radius:999px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(20px);border:1px solid var(--rule);box-shadow:0 16px 40px -18px rgba(30,20,50,.45);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;text-align:center;font:600 13px/1 var(--b);color:var(--ink2)}
.tab b{color:var(--ink);font-weight:700}
</style></head><body><div class="page">
<header><div class="wm">Nasty<span>Plot</span></div><div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8h16M4 16h16"/></svg></div></header>
<section class="hero" id="hero"></section><section class="grade" id="grade"></section><section class="pairs" id="pairs"></section>
<section class="prev" id="prev"></section><section class="speed" id="speed"></section><section class="week" id="week"></section><section class="tools" id="tools"></section>
<footer><div class="wm">Nasty<span>Plot</span></div>Team building for Pokémon Champions, from real tournament results.<br>How the ratings work · About · Send feedback</footer>
<div class="tab" id="tab"><b>Build</b><span>My team</span><span>Battle</span><span>Meta</span></div>
</div><script>
/*DATA*/
const DARK=document.documentElement.dataset.theme==='dark',K=DARK?.7:1,N=n=>n.toLocaleString('en-US'),$=id=>document.getElementById(id);
function hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let h=0,s=0;if(d){s=d/(1-Math.abs(2*l-1));h=mx==r?((g-b)/d)%6:mx==g?(b-r)/d+2:(r-g)/d+4;h=(h*60+360)%360;}return[h,s,l];}
async function meta(src){const im=new Image();im.src=src;await im.decode();const S=64,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');x.drawImage(im,0,0,S,S);const d=x.getImageData(0,0,S,S).data,B=Array.from({length:18},()=>[0,0,0,0]);let x0=S,x1=0,y0=S,y1=0;
  for(let i=0;i<d.length;i+=4){if(d[i+3]<60)continue;const px=(i/4)%S,py=Math.floor(i/4/S);x0=Math.min(x0,px);x1=Math.max(x1,px);y0=Math.min(y0,py);y1=Math.max(y1,py);if(d[i+3]<200)continue;const[h,s,l]=hsl(d[i],d[i+1],d[i+2]);if(s<.28||l<.2||l>.86)continue;const b=B[Math.floor(h/20)%18],w=s*s;b[0]+=d[i]*w;b[1]+=d[i+1]*w;b[2]+=d[i+2]*w;b[3]+=w;}
  const o=B.map((b,i)=>({i,w:b[3],c:b[3]?b.slice(0,3).map(v=>Math.round(v/b[3])):[205,205,215]})).sort((a,b)=>b.w-a.w),a=o[0],b2=o.find(q=>q.w>a.w*.12&&Math.min(Math.abs(q.i-a.i),18-Math.abs(q.i-a.i))>=3)||a;
  return{a:a.c,b:b2.c,l:x0/S,r:(x1+1)/S,top:y0/S,bot:(y1+1)/S};}
const rgb=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`,accent=c=>{const[h,s]=hsl(c[0],c[1],c[2]);return `hsl(${h.toFixed(0)} ${Math.round(Math.max(s,.62)*100)}% ${DARK?70:40}%)`;};
const wash=(c,x,y,w,h,a)=>`<i class="wash" style="left:${x-w/2}px;top:${y-h/2}px;width:${w}px;height:${h}px;background:radial-gradient(closest-side,${rgb(c,a*K)},${rgb(c,0)})"></i>`;
const img=(m,x,y,z,st='')=>`<img class="mon" src="${m.img}" style="left:${x}px;top:${y}px;width:${z}px;height:${z}px;${st}">`;
const sh=(cx,cy,w,h,o=1)=>`<i class="shadow" style="left:${cx-w/2}px;top:${cy-h/2}px;width:${w}px;height:${h}px;opacity:${o}"></i>`;
const M={};
function stand(m,cx,fl,z,o={}){const k=M[m.n],mid=(k.l+k.r)/2,l=cx-z*(o.flip?1-mid:mid),t=fl-z*k.bot,w=z*(k.r-k.l),fx=o.flip?'scaleX(-1)':'';
  return(o.noshadow?'':sh(cx,fl,w*.9,Math.max(8,w*.12),o.so||1))
    +(o.refl?`<img class="mon" src="${m.img}" style="left:${l}px;top:${fl-z*(1-k.bot)}px;width:${z}px;height:${z}px;transform:scaleY(-1) ${fx};opacity:.17;-webkit-mask-image:linear-gradient(0deg,#000,transparent 42%);z-index:2">`:'')
    +img(m,l,t,z,`z-index:${o.z||3};${fx?'transform:'+fx+';':''}${o.st||''}`);}
(async()=>{
  const all={};for(const m of[D.hero,...D.back,...D.extra,...D.rail,D.pair.a,D.pair.b,...D.team,...D.them,...D.speed,...D.up,...D.down,...D.doors])all[m.n]=m;
  await Promise.all(Object.values(all).map(async m=>{M[m.n]=await meta(m.img);}));
  // ---------- hero ----------
  const H=D.hero,a=M[H.n].a,b=M[H.n].b,wh=D.extra[0],whUp=D.up.find(x=>x.n===wh.n);
  $('hero').innerHTML=wash(a,220,560,620,640,.62)+wash(b,340,760,380,320,.42)
    +`<div class="ground" style="background:linear-gradient(180deg,${rgb(a,.14*K)},${rgb(a,0)})"></div>`
    +stand(D.back[0],318,640,190,{noshadow:1,z:1,st:'filter:blur(4px) saturate(.85) opacity(.45);'})+stand(D.back[1],62,660,150,{noshadow:1,z:1,st:'filter:blur(4px) saturate(.85) opacity(.4);'})
    +stand(H,196,770,330,{refl:1})+img(wh,292,404,84,'z-index:4;transform:rotate(8deg)')
    
    +`<div class="txt" style="top:84px"><div class="eyebrow">Pokémon Champions · Reg M-C doubles</div><h1>Sharply raise<b style="color:${accent(a)}">your win rate.</b></h1>
      <p class="lede">Every good team starts as a plot. NastyPlot plans yours from <b>${N(D.teams)} real tournament teams</b>.</p>
      <div class="acts"><span class="pill">Build me a team</span><span class="link">Check my team</span></div></div>`
    +`<div class="cap" style="left:196px;top:784px;font-size:15px">${H.d}<small>${H.t.join(' · ')}</small></div>`
    +`<div class="specs">${[[H.r,'','NastyPlot rating, the highest right now'],[H.u,'%','of teams bring it'],[H.w,'%','of its games won']].map(s=>`<div><div class="num">${s[0]}<small>${s[1]}</small></div><span>${s[2]}</span></div>`).join('')}</div>`
    +`<div class="rail">${D.rail.slice(0,5).map((m,i)=>`<div class="it ${i?'':'on'}"><span class="im" style="--c:${rgb(M[m.n].a,.6)}"><img src="${m.img}"></span><div>${m.d}<small>${m.r}</small></div></div>`).join('')}</div>`;
  // ---------- grade ----------
  const G=D.sample,gx=i=>72+123*(i%3),gf=i=>i<3?440:630,gz=[136,136,124,112,116,128];let g=D.team.map((m,i)=>wash(M[m.n].a,gx(i),gf(i)-60,230,230,.5)).join('');
  g+=`<div class="giant" style="top:228px;font-size:270px;background-image:linear-gradient(90deg,${D.team.slice(0,4).map(m=>rgb(M[m.n].a,.62)).join(',')})">${G.score}</div><div class="badge" style="left:26px;top:196px">${G.letter}</div>`;
  D.team.forEach((m,i)=>{g+=stand(m,gx(i),gf(i),gz[i],{refl:1})+`<div class="cap" style="left:${gx(i)}px;top:${gf(i)+12}px">${m.d}<i>${m.r}</i></div>`;});
  $('grade').innerHTML=g+`<div class="txt" style="top:64px"><div class="eyebrow">My team · The grade</div><h2>Your six, <b>graded out of 100.</b></h2></div>
    <div class="facts"><div><b>${G.ready}%</b>ready for the top ${G.of}</div><div><b>${G.handled}</b>matchups handled</div><div><b>${G.shaky}</b>still shaky</div></div>
    <div style="position:absolute;z-index:5;left:24px;right:24px;top:786px;font-size:13px;color:var(--ink3)">Shown: NastyPlot's sample team, ${G.name}.<br><span class="link" style="font-size:15px;display:inline-block;margin-top:12px">Grade my team</span></div>`;
  // ---------- pairs ----------
  const P=D.pair,pa=M[P.a.n].a,pb=M[P.b.n].a;
  $('pairs').innerHTML=wash(pa,290,520,420,460,.52)+wash(pb,100,540,420,460,.52)
    +`<div class="giant" style="top:372px;font-size:176px;background-image:linear-gradient(90deg,${rgb(pb,.6)},${rgb(pa,.6)})">${P.w}</div>`
    +`<div class="floor" style="top:690px"></div>`+stand(P.b,104,690,196,{flip:1,refl:1})+stand(P.a,288,690,196,{refl:1})+`<div class="plus" style="left:175px;top:596px">+</div>`
    +`<div class="cap" style="left:104px;top:704px">${P.b.d}<i>${P.b.r}</i></div><div class="cap" style="left:288px;top:704px">${P.a.d}<i>${P.a.r}</i></div>`
    +`<div class="txt" style="top:64px"><div class="eyebrow">Build · Winning cores</div><h2>Doubles is played <b>in pairs.</b></h2>
      <p class="lede">${P.a.d} and ${P.b.d} win <b>${P.w}%</b> of their games together, across ${N(P.n)} teams. The average team wins ${D.base}%.</p>
      <div class="acts"><span class="link">Find my best partners</span></div></div>`;
  // ---------- preview ----------
  const tm=n=>D.team.find(m=>m.n===n),L1=tm(G.lead[0]),L2=tm(G.lead[1]),B1=tm(G.back[0]),B2=tm(G.back[1]),N1=tm(G.bench[0]),N2=tm(G.bench[1]);
  let pv=wash(M[L1.n].a,120,684,300,320,.52)+wash(M[L2.n].a,280,684,300,320,.52)+`<div class="role" style="top:312px">THEIR SIX · THE META'S TOP SIX</div><div class="floor" style="top:408px"></div>`;
  D.them.forEach((m,i)=>{pv+=stand(m,42+61.2*i,408,62,{so:.7});});
  pv+=stand(N1,46,504,64,{so:.5,z:2,st:'filter:saturate(.35) opacity(.55);'})+stand(N2,344,504,64,{so:.5,z:2,st:'filter:saturate(.35) opacity(.55);'})
    +stand(B1,88,624,124,{z:3,refl:1})+stand(B2,312,624,108,{z:3,refl:1})+stand(L1,128,764,178,{z:4,refl:1})+stand(L2,276,764,178,{z:4,refl:1})
    +`<div class="cap" style="left:128px;top:778px">${L1.d}<small>Lead</small></div><div class="cap" style="left:276px;top:778px">${L2.d}<small>Lead</small></div>
      <div class="cap" style="left:46px;top:512px;font-weight:500;color:var(--ink3)">Bench</div><div class="cap" style="left:344px;top:512px;font-weight:500;color:var(--ink3)">Bench</div>
      <div class="cap" style="left:40px;top:632px"><small>Back</small></div><div class="cap" style="left:352px;top:632px"><small>Back</small></div>`;
  $('prev').innerHTML=pv+`<div class="txt" style="top:64px"><div class="eyebrow">Battle · Team preview</div><h2>See their six.<br><b>Pick your four.</b></h2>
    <p class="lede">Against the meta's top six, NastyPlot brings four of the sample team: <b>${L1.d} and ${L2.d} lead</b>, ${B1.d} and ${B2.d} wait in the back.</p></div>
    <div style="position:absolute;z-index:5;left:24px;top:842px"><span class="link">Open Battle mode</span></div>`;
  // ---------- speed: fastest first ----------
  const sp=[...D.speed].sort((x,y)=>y.sp-x.sp);let sd='';
  sp.forEach((m,i)=>{const y=270+76*i,c=M[m.n].a;sd+=wash(c,60,y+36,150,150,.5)+`<div class="srow" style="top:${y}px">${img(m,0,0,72)}<div class="nm">${m.d}</div><i class="bar" style="width:${Math.round(m.sp/142*190)}px;background:${accent(c)}"></i><div class="sp" style="color:${accent(c)}">${m.sp}</div></div>`;});
  $('speed').innerHTML=sd+`<div class="txt" style="top:64px"><div class="eyebrow">Battle · Speed tiers</div><h2>Who moves <b>first.</b></h2><div class="seg"><span class="on">No field</span><span>Tailwind</span><span>Trick Room</span></div></div>
    <div style="position:absolute;left:24px;top:736px;font-size:13px;color:var(--ink3)">Base Speed. Switch the field and the order changes.</div>`;
  // ---------- week ----------
  let wk='';const row=(arr,by)=>arr.forEach((m,i)=>{const cx=75+120*i,lift=m.v*11,z=96,cy=by-lift,c=M[m.n].a;wk+=wash(c,cx,cy,200,200,.5)+`<i class="stem" style="left:${cx}px;top:${Math.min(by,cy)}px;height:${Math.abs(lift)}px"></i>`+img(m,cx-z/2,cy-z/2-(m.v>0?z*.5:-z*.5),z,'z-index:3')
    +`<div class="v" style="left:${cx}px;top:${m.v>0?cy-z-36:cy+z+8}px;color:${accent(c)}">${m.v>0?'+':'−'}${Math.abs(m.v)}</div><div class="cap" style="left:${cx}px;top:${m.v>0?by+10:by-28}px">${m.d}</div>`;});
  row(D.up,486);row(D.down,566);
  const fd=s=>new Date(s+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
  $('week').innerHTML=wk+`<div class="floor" style="top:486px"></div><div class="floor" style="top:566px"></div>
    <div class="txt" style="top:64px"><div class="eyebrow">Meta · ${fd(D.wk.from)} to ${fd(D.wk.to)}</div><h2>What moved <b>this week.</b></h2><p class="lede">Points of usage gained or lost across ${N(D.wk.n)} teams.</p></div>
    <div style="position:absolute;z-index:5;left:24px;top:780px"><span class="link">See the whole meta</span></div>`;
  // ---------- tools ----------
