<!doctype html><html lang="en"><head><meta charset="utf-8"><title>NastyPlot My Box concept</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300..900&family=Instrument+Sans:wght@400..700&display=swap">
<style>
:root{--bg:#FBFAF7;--ink:#17161A;--ink2:#48454F;--ink3:#66636E;--rule:rgba(23,22,26,.11);--plot:#0078BF;--u:"Unbounded",system-ui,sans-serif;--b:"Instrument Sans",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1440px;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--b);-webkit-font-smoothing:antialiased;font-synthesis:style}
.page{width:1440px;overflow:hidden;position:relative}
.u{font-family:var(--u);font-style:italic;font-weight:900;letter-spacing:-.02em}
header{height:76px;display:flex;align-items:center;padding:0 96px}header .logo svg{height:40px;display:block}
nav{display:flex;gap:38px;margin:0 auto}nav a{font:500 15px/1 var(--b);color:var(--ink2)}nav a.on{color:var(--ink);font-weight:700;position:relative}
nav a.on::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:5px;background:var(--plot);transform:skewX(-24deg)}
header .s{display:flex;align-items:center;gap:10px;color:var(--ink2);font:500 15px/1 var(--b)}
main{display:grid;grid-template-columns:270px 1fr 290px;gap:36px;padding:24px 96px 64px;align-items:start}
.eyebrow{display:flex;align-items:center;gap:10px;font:600 13px/1 var(--b);letter-spacing:.04em;color:var(--ink2)}
.eyebrow::before{content:"";width:20px;height:7px;background:var(--plot);transform:skewX(-24deg)}
.link{font:600 15px/1 var(--b);color:var(--ink);border-bottom:1.5px solid currentColor;padding-bottom:2px;white-space:nowrap}
.q{font:500 15px/1 var(--b);color:var(--ink2);white-space:nowrap}
h1{font-size:46px;line-height:1.02;margin:16px 0 6px}
.count{font:600 15px/1 var(--b);color:var(--ink2)}
.side p{font-size:15px;color:var(--ink2);margin-top:14px;line-height:1.5}
.add{display:flex;align-items:center;gap:10px;height:52px;padding:0 18px;margin-top:22px;border:1.5px solid var(--ink);font:500 15px/1 var(--b);color:var(--ink3);transform:skewX(-10deg)}.add span{transform:skewX(10deg)}.add b{margin-left:auto;font:800 20px/1 var(--u);color:var(--ink);transform:skewX(10deg)}
.lab{font-size:13px;color:var(--ink3);margin:24px 0 8px}
.sort{display:flex;flex-wrap:wrap;gap:6px}
.sort span{height:36px;padding:0 15px;display:flex;align-items:center;font:600 14px/1 var(--b);border-radius:999px;background:rgba(128,124,136,.14);color:var(--ink2)}.sort span.on{background:var(--ink);color:var(--bg)}
.mini{padding:13px 0;border-top:1px solid var(--rule);display:flex;justify-content:space-between;font-size:15px;font-weight:600}.mini span{color:var(--ink3);font-weight:500}
.fine{font-size:13px;color:var(--ink3);line-height:1.45;margin-top:12px}
/* the box */
.box{position:relative;border-radius:18px;overflow:hidden;padding:0 26px 22px}
.box .wall{position:absolute;inset:0;z-index:0}
.box .rays{position:absolute;inset:-30%;z-index:0;background:repeating-conic-gradient(from 6deg at 50% 46%,rgba(255,255,255,.34) 0 1.4deg,transparent 1.4deg 12deg);-webkit-mask-image:radial-gradient(closest-side,transparent 30%,#000 70%,transparent 100%)}
.bar{position:relative;z-index:2;height:70px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;text-align:center}
.bar .ar{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.75);display:grid;place-items:center;font:800 16px/1 var(--u)}
.bar h2{font-size:22px}.bar small{display:block;font:500 13px/1 var(--b);font-style:normal;letter-spacing:0;color:var(--ink2);margin-top:6px}
.grid{position:relative;z-index:2;display:grid;grid-template-columns:repeat(6,1fr);gap:2px 0}
.cell{position:relative;height:124px;text-align:center}
.cell img{position:absolute;left:50%;width:88px;height:88px;margin-left:-44px;z-index:2}
.cell .sh{position:absolute;left:50%;top:88px;width:60px;height:10px;margin-left:-30px;border-radius:50%;background:radial-gradient(closest-side,rgba(30,20,50,.3),transparent)}
.cell .n{position:absolute;left:-6px;right:-6px;top:98px;font:600 13px/1.2 var(--b);white-space:nowrap}
.cell .tm{position:absolute;z-index:3;left:50%;margin-left:26px;top:6px;width:18px;height:8px;background:var(--plot);transform:skewX(-24deg)}
.cell.on{z-index:4}.cell.on::before{content:"";position:absolute;left:6px;right:6px;top:0;height:96px;border-radius:14px;background:rgba(255,255,255,.82);box-shadow:0 18px 30px -16px rgba(30,20,50,.5)}
.cell.on img{width:104px;height:104px;margin-left:-52px;margin-top:-18px}.cell.on .sh{top:92px;width:70px;margin-left:-35px;opacity:.6}
.cell.on .n{font-weight:700}
.dots{position:relative;z-index:2;display:flex;justify-content:center;gap:8px;margin-top:10px}.dots i{width:22px;height:6px;background:rgba(23,22,26,.25);transform:skewX(-24deg)}.dots i.on{background:var(--ink)}
.party{margin-top:22px}
.party .ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}.party .ph b{font-size:17px}.party .ph span{font-size:14px;color:var(--ink2)}
.prow{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--rule);padding-top:10px}
.prow div{text-align:center;font:600 13px/1.2 var(--b)}.prow img{width:76px;height:76px;display:block;margin:0 auto}.prow small{display:block;font-weight:500;color:var(--ink2)}
/* selected */
.sel{position:relative;padding-top:6px}
.panel{position:absolute;left:0;right:0;top:34px;height:250px;transform:skewY(-7deg);border-radius:6px;overflow:hidden}
.panel::after{content:"";position:absolute;inset:-40%;background:repeating-conic-gradient(from 8deg at 50% 62%,rgba(255,255,255,.5) 0 1.6deg,transparent 1.6deg 15deg);-webkit-mask-image:radial-gradient(closest-side,transparent 22%,#000 58%,transparent 96%)}
.sel .art{position:relative;z-index:2;display:block;width:270px;height:270px;margin:0 auto}
.plate{position:absolute;z-index:4;left:-6px;top:236px;height:36px;padding:0 18px;display:flex;align-items:center;background:var(--ink);color:var(--bg);font:800 13px/1 var(--u);font-style:italic;white-space:nowrap;clip-path:polygon(11px 0,100% 0,calc(100% - 11px) 100%,0 100%)}
.sel h3{font-size:30px;line-height:1.05;margin-top:26px}
.ty{display:inline-block;font:700 13px/1 var(--b);padding:5px 11px;border-radius:999px;color:#fff;margin:10px 5px 0 0}
.tag{display:inline-block;font:600 13px/1 var(--b);padding:5px 11px;border-radius:999px;border:1.5px solid var(--ink);margin-top:10px}
.three{display:grid;grid-template-columns:repeat(3,auto);justify-content:space-between;margin-top:20px}
.three b{display:block;font:500 24px/1.1 var(--u);font-style:italic;letter-spacing:-.04em}.three span{display:block;font-size:13px;color:var(--ink2);margin-top:3px}
.pill{display:flex;align-items:center;justify-content:center;height:52px;background:var(--ink);color:var(--bg);font:800 14px/1 var(--u);font-style:italic;white-space:nowrap;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);margin-top:22px}
footer{display:flex;align-items:center;gap:40px;padding:0 96px;height:96px;border-top:1px solid var(--rule);font-size:14px;color:var(--ink2)}footer svg{height:28px;display:block}footer .r{margin-left:auto;display:flex;gap:32px}
</style></head><body><div class="page">
<header><div class="logo">%LOGO%</div><nav><a>Build</a><a class="on">My team</a><a>Battle</a><a>Meta</a></nav>
  <div class="s"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span>Search</span></div></header>
<main id="main"></main>
<footer>%LOGO2%<span>NastyPlot is an unofficial, fan-made tool.</span><div class="r"><span>How scoring works</span><span>About</span><span>Send feedback</span></div></footer>
</div><script>
/*DATA*/
const TY={Dragon:'#5060E1',Ground:'#9A6230',Fighting:'#D9631B',Poison:'#8E3FC8',Dark:'#5A4A56',Steel:'#4F8FA6',Fire:'#DD4420',Water:'#2A78D8',Grass:'#2E9A46',Fairy:'#C953C2',Flying:'#5F97D8',Ghost:'#6A4BB8',Psychic:'#D93E78',Ice:'#1E9FBF',Rock:'#8F8556',Electric:'#B88A00',Normal:'#8E908C',Bug:'#7F9A12'};
function hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let h=0,s=0;if(d){s=d/(1-Math.abs(2*l-1));h=mx==r?((g-b)/d)%6:mx==g?(b-r)/d+2:(r-g)/d+4;h=(h*60+360)%360;}return[h,s,l];}
async function meta(src){const im=new Image();im.src=src;await im.decode();const S=64,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');x.drawImage(im,0,0,S,S);const d=x.getImageData(0,0,S,S).data,B=Array.from({length:18},()=>[0,0,0,0]);let y1=0;
  for(let i=0;i<d.length;i+=4){if(d[i+3]<60)continue;y1=Math.max(y1,Math.floor(i/4/S));if(d[i+3]<200)continue;const[h,s,l]=hsl(d[i],d[i+1],d[i+2]);if(s<.28||l<.2||l>.86)continue;const b=B[Math.floor(h/20)%18],w=s*s;b[0]+=d[i]*w;b[1]+=d[i+1]*w;b[2]+=d[i+2]*w;b[3]+=w;}
  const o=B.map((b,i)=>({i,w:b[3],c:b[3]?b.slice(0,3).map(v=>Math.round(v/b[3])):[205,205,215]})).sort((a,b)=>b.w-a.w),a=o[0],b2=o.find(q=>q.w>a.w*.12&&Math.min(Math.abs(q.i-a.i),18-Math.abs(q.i-a.i))>=3)||a;return{a:a.c,b:b2.c,bot:(y1+1)/S};}
const rgb=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
(async()=>{
  const M={};await Promise.all(D.box.map(async m=>{M[m.n]=await meta(m.img);}));
  const first=D.box.slice(0,30),sel=D.box.find(m=>m.n===D.sel),k=M[sel.n];
  // the wallpaper is mixed from the Pokemon in the box: one soft colour per corner region
  const pick=i=>M[first[i].n].a,wall=`radial-gradient(60% 60% at 12% 14%,${rgb(pick(1),.5)},transparent),radial-gradient(60% 60% at 88% 12%,${rgb(pick(5),.5)},transparent),radial-gradient(60% 60% at 14% 88%,${rgb(pick(24),.48)},transparent),radial-gradient(60% 60% at 88% 86%,${rgb(pick(13),.48)},transparent),linear-gradient(#F4F0EA,#F4F0EA)`;
  const cells=first.map(m=>`<div class="cell ${m.n===D.sel?'on':''}"><i class="sh"></i><img src="${m.img}" style="top:${92-88*M[m.n].bot}px">${m.team?'<i class="tm"></i>':''}<div class="n">${m.d}</div></div>`).join('');
  document.getElementById('main').innerHTML=`
  <div class="side"><div class="eyebrow">My team · The Pokémon you own</div><h1 class="u">My Box</h1><div class="count">${D.box.length} Pokémon · 2 boxes</div>
    <p>Build for me and the suggestions pick from these when set to "My box".</p>
    <div class="add"><span>Add a Pokémon</span><b>+</b></div>
    <div class="lab">Arrange by</div><div class="sort"><span class="on">A–Z</span><span>Type</span><span>Newest</span><span>Oldest</span><span>Rating</span></div>
    <div style="margin-top:26px"><div class="mini">Copy box link<span>›</span></div><div class="mini">Open a box link<span>›</span></div><div class="mini" style="border-bottom:1px solid var(--rule)">Reset box<span>›</span></div></div>
    <p class="fine">Saved in this browser only: this device isn't connected to your account.</p>
    <p class="fine"><i style="display:inline-block;width:18px;height:8px;background:var(--plot);transform:skewX(-24deg);margin-right:8px"></i>On your team</p></div>
  <div><div class="box"><div class="wall" style="background:${wall}"></div><div class="rays"></div>
      <div class="bar"><span class="ar">◀</span><div><h2 class="u">Box 1</h2><small>30 of ${D.box.length} · A to S</small></div><span class="ar">▶</span></div>
      <div class="grid">${cells}</div><div class="dots"><i class="on"></i><i></i></div></div>
    <div class="party"><div class="ph"><b>Your team</b><span>6 of 6 · drag between the box and your team</span></div>
      <div class="prow">${D.team.map(m=>`<div><img src="${m.img}">${m.d}<small>${m.role}</small></div>`).join('')}</div></div></div>
  <div class="sel"><div class="panel" style="background:linear-gradient(150deg,${rgb(k.a,.85)},${rgb(k.b,.7)})"></div><img class="art" src="${sel.img}"><div class="plate">Rated ${sel.r} · ${sel.tier}</div>
    <h3 class="u">${sel.d}</h3><div>${sel.t.map(t=>`<span class="ty" style="background:${TY[t]}">${t}</span>`).join('')}<span class="tag">On your team</span></div>
    <div class="three"><div><b>${sel.u}%</b><span>of teams</span></div><div><b>${sel.w}%</b><span>win rate</span></div><div><b>${sel.sp}</b><span>base Speed</span></div></div>
    <div class="pill">Open info sheet ➜</div>
    <div style="margin-top:14px"><div class="mini">Build around it<span>›</span></div><div class="mini">Swap into my team<span>›</span></div><div class="mini" style="border-bottom:1px solid var(--rule)">Remove from box<span>›</span></div></div></div>`;
  document.body.dataset.ready=1;
})();
</script></body></html>
