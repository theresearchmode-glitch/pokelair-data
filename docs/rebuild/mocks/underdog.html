<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Unbounded:wght@800;900&display=swap">
<link rel="stylesheet" href="tokens.css">
<style>
/* Featured underdog (Sim, Nov 11): the one featured Pokémon gets a glow in the site's own colours: PLOT blue light with a
   soft pink edge from the logo's ring. The pulse moves only the opacity of a separate light layer (cheap to draw); the art itself
   never animates and gets no will-change. Reduce motion = still. */
body{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.ud{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center;max-width:620px;width:100%}
.ud .stage{position:relative;width:220px;height:220px}

@media (prefers-reduced-motion:reduce){}
.ud img{position:relative;width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 0 1px rgba(255,255,255,.9)) drop-shadow(0 0 10px rgba(0,120,191,.45)) drop-shadow(0 0 22px rgba(232,54,79,.22))}
.ud .k{font:600 13px/1 var(--b);letter-spacing:.04em;color:var(--ink-2);display:flex;align-items:center;gap:10px}
.ud .k::before{content:"";width:20px;height:7px;background:linear-gradient(90deg,var(--plot),var(--pick));transform:skewX(var(--slant))}
.ud h2{font-size:34px;margin:8px 0 8px}.ud h2 span{color:var(--plot)}
.ud p{font-size:16px;color:var(--ink-2);max-width:340px}
.ud .row{display:flex;gap:20px;align-items:center;margin-top:16px;font:600 15px/1 var(--b)}.ud .row .btn{height:48px}.ud .row a{border-bottom:1.5px solid currentColor;padding-bottom:2px}
@media (max-width:520px){.ud{grid-template-columns:1fr;justify-items:center;text-align:center}.ud .k{justify-content:center}.ud p{margin:0 auto}.ud .row{justify-content:center}}
.ud .fav{display:inline-flex;align-items:center;gap:6px;margin-top:16px;font:600 15px/1.3 var(--b);color:var(--plot-text)}
.ud .fav span{transition:transform .2s}.ud .fav:hover span{transform:translateX(3px)}
/* Underdog (Sim, Nov 11): stands on the floor like the six on My Team, on a pool of the site's colours (PLOT blue into the
   logo's pink) instead of a free-floating cloud; the fun glow is a thin brand-coloured rim on the art. The pool breathes slowly
   (opacity of its own layer only; the art never animates). Reduce motion = still. */
.ud .stage{position:relative}
.ud .pool{position:absolute;left:4%;right:4%;bottom:2%;height:16%;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(23,22,26,.30),transparent 55%) center/40% 45% no-repeat,radial-gradient(closest-side,rgba(0,120,191,.55),rgba(0,120,191,.22) 50%,rgba(232,54,79,.14) 72%,transparent)}
.ud .pool.b{background:radial-gradient(closest-side,rgba(232,54,79,.30),rgba(0,120,191,.18) 60%,transparent);animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.ud .pool.b{animation:none;opacity:.6}}
:root[data-theme="dusk"] .ud .pool{background:radial-gradient(closest-side,rgba(98,190,247,.9),rgba(98,190,247,.32) 45%,rgba(240,112,138,.18) 70%,transparent);filter:blur(1.5px)}
:root[data-theme="dusk"] .ud .pool.b{background:radial-gradient(closest-side,rgba(240,112,138,.45),rgba(98,190,247,.2) 60%,transparent)}
.ud .stage img{filter:drop-shadow(0 0 1px rgba(255,255,255,.9)) drop-shadow(0 0 6px rgba(0,120,191,.45)) drop-shadow(0 0 3px rgba(232,54,79,.25)) drop-shadow(4px 8px 8px rgba(30,20,50,.16))}
:root[data-theme="dusk"] .ud .stage img{filter:drop-shadow(0 0 1px rgba(255,255,255,.75)) drop-shadow(0 0 7px rgba(98,190,247,.6)) drop-shadow(0 -1px 4px rgba(240,112,138,.35))}
</style></head><body>
<script>document.documentElement.dataset.theme=location.hash.slice(1)||'light'</script>
<div class="ud"><div class="stage"><i class="pool"></i><i class="pool b"></i><img src="../art/up1024/841.webp" alt="Flapple"></div>
<div><div class="k">Today's underdog</div><h2 class="u">Flapple. <span>Somebody's favourite.</span></h2>
<p>Rarely picked in tournaments, but every Pokémon deserves its moment. Maybe it's yours?</p>
<div class="row"><div class="btn main">Build around it</div><a>Info Sheet</a></div>
<!-- opens Build for Me with its existing "Build around a Pokémon" pick ready to choose (61-concept-h-pages.js, ui.abLock) -->
<a class="fav">Or build around your favourite Pokémon <span aria-hidden="true">→</span></a></div></div>
</body></html>
