<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Unbounded:wght@800;900&display=swap">
<link rel="stylesheet" href="tokens.css">
<style>
/* First visit to My Team (R2). Layout: reference set Nov 11 section 9; underdog block: underdog.html (Sim, Nov 11). Real data. */
:root{--gut:96px}
.page{position:relative;overflow:hidden;min-height:100vh}
header{position:relative;z-index:1;height:76px;display:flex;align-items:center;padding:0 var(--gut)}header .logo svg{height:36px;display:block}
nav{display:flex;gap:36px;margin:0 auto}nav a{font:500 15px/1 var(--b);color:var(--ink-2)}
nav a.on{color:var(--ink);font-weight:700;position:relative}nav a.on::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:5px;background:var(--plot);transform:skewX(var(--slant))}
header .s{font:500 15px/1 var(--b);color:var(--ink-2)}
main{position:relative;z-index:1}
/* hero: words left, the six empty spots on the floor right */
.hero{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:56px;align-items:center;padding:24px var(--gut) 48px}
.hero h1{font-size:48px;margin:12px 0 16px}.hero h1>span{display:block;white-space:nowrap}.hero h1 .pl{color:var(--plot)}
.hero p{font-size:17px;color:var(--ink-2);max-width:440px}
.go{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px;max-width:470px}
.go .btn{grid-column:1/-1;height:52px}.go .btn2{height:48px}
.hero .note{margin-top:16px;font:400 13px/1.5 var(--b);color:var(--ink-3);max-width:440px}
.slots{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.grp .lab{display:flex;align-items:center;gap:8px;margin-bottom:12px;font:900 17px/1 var(--u);font-style:italic;color:var(--ink-2)}
.grp .lab i{width:14px;height:7px;transform:skewX(var(--slant));background:var(--ink-3)}.grp.lead .lab i{background:var(--plot)}.grp.lead .lab{color:var(--plot-text)}
.grp .two{display:grid;gap:16px}
@media (min-width:99999px){.slots::before{content:"";position:absolute;left:-40px;right:-40px;top:118px;height:90px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(23,22,26,.13) 12%,rgba(23,22,26,.13) 88%,transparent) top/100% 1px no-repeat,radial-gradient(52% 100% at 50% 0,rgba(60,40,110,.055),transparent)}}
:root[data-theme="dusk"] .slots::before{background:linear-gradient(90deg,transparent,rgba(214,218,255,.3) 12%,rgba(214,218,255,.3) 88%,transparent) top/100% 1px no-repeat,radial-gradient(52% 100% at 50% 0,rgba(150,160,255,.2),transparent)}
.slot{text-align:center}
.slot i{display:grid;place-items:center;height:150px;margin:8px 4px;border:1.5px dashed color-mix(in srgb,var(--ink) 34%,transparent);border-radius:var(--r-m);transform:skewY(-7deg);
  font:900 24px/1 var(--u);color:var(--ink-3)}
.slot i b{transform:skewY(7deg)}

/* below: winners (left) and today's underdog (right), even halves */
.more{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;padding:40px var(--gut) 64px;border-top:1px solid var(--rule)}
.more h2{font-size:28px}.more .sub{font-size:15px;color:var(--ink-2);margin:4px 0 8px}
.win{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 12px}
.w{position:relative;text-align:center;padding-top:8px}
.w .sh{position:absolute;left:50%;top:108px;width:110px;height:22px;margin-left:-55px;border-radius:50%;background:radial-gradient(closest-side,var(--contact),transparent 60%) center/46% 50% no-repeat,radial-gradient(closest-side,rgba(var(--cp),.55),rgba(var(--cp),.25) 55%,transparent)}
:root[data-theme="dusk"] .w .sh{background:radial-gradient(closest-side,rgba(var(--cp),.85),rgba(var(--cp),.3) 45%,transparent);filter:blur(1.5px)}
.w img{position:relative;width:112px;height:112px;object-fit:contain;object-position:50% 100%;display:block;margin:0 auto;filter:drop-shadow(4px 7px 7px rgba(30,20,50,.16))}
:root[data-theme="dusk"] .w img{filter:drop-shadow(0 0 .6px rgba(255,255,255,.55)) drop-shadow(0 -1px 5px rgba(var(--cp),.3))}
.w b{position:relative;display:block;font:700 15px/1.25 var(--b);margin-top:8px}.w small{display:block;font:500 13px/1.4 var(--b);color:var(--ink-2)}
/* underdog (same block as underdog.html, sized for a half) */
.ud{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:center;align-self:center}
.ud .stage{position:relative;width:200px;height:200px}
@media (prefers-reduced-motion:reduce){}
.ud img{position:relative;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 1px rgba(255,255,255,.9)) drop-shadow(0 0 10px rgba(0,120,191,.45)) drop-shadow(0 0 22px rgba(232,54,79,.22))}
:root[data-theme="dusk"] :root[data-theme="dusk"] :root[data-theme="dusk"] .ud img{filter:drop-shadow(0 0 1px rgba(255,255,255,.7)) drop-shadow(0 0 12px rgba(98,190,247,.55)) drop-shadow(0 0 26px rgba(240,112,138,.30))}
.ud .k{font:600 13px/1 var(--b);letter-spacing:.04em;color:var(--ink-2);display:flex;align-items:center;gap:10px}
.ud .k::before{content:"";width:20px;height:7px;background:linear-gradient(90deg,var(--plot),var(--pick));transform:skewX(var(--slant))}
.ud h3{font-size:28px;margin:8px 0}.ud h3 span{color:var(--plot)}
.ud p{font-size:15px;color:var(--ink-2)}
.ud .row{display:flex;gap:20px;align-items:center;margin-top:16px;font:600 15px/1 var(--b)}.ud .row .btn{height:48px}.ud .row a{border-bottom:1.5px solid currentColor;padding-bottom:2px}
.ud .fav{display:inline-flex;gap:6px;margin-top:16px;font:600 15px/1.3 var(--b);color:var(--plot-text)}
@media (max-width:1180px){:root{--gut:48px}.more{grid-template-columns:1fr}.hero{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}.hero h1{font-size:34px}}
@media (max-width:699px){:root{--gut:16px}nav{display:none}header{justify-content:space-between}
  .hero{grid-template-columns:minmax(0,1fr);gap:28px;padding:8px var(--gut) 32px}.hero h1{font-size:34px}
  .slots{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 12px}.slot i{height:84px}.grp .two{gap:8px}.grp .lab{font-size:15px}
  .go{grid-template-columns:1fr 1fr}.go .btn2{padding:0 8px;white-space:nowrap}
  .more{padding:32px var(--gut) 48px;gap:40px}.win{grid-template-columns:repeat(3,minmax(0,1fr))}.w img{width:88px;height:88px}.w .sh{top:84px;width:84px;margin-left:-42px}
  .w b{font-size:13px}.w small span{display:block}.w small span+span::first-letter{}
  .ud{grid-template-columns:1fr;justify-items:center;text-align:center}.ud .k,.ud .row{justify-content:center}}
/* Underdog (Sim, Nov 11): stands on the floor like the six on My Team, on a pool of the site's colours (PLOT blue into the
   logo's pink) instead of a free-floating cloud; the fun glow is a thin brand-coloured rim on the art. The pool breathes slowly
   (opacity of its own layer only; the art never animates). Reduce motion = still. */
.ud .stage{position:relative}
.ud .pool{position:absolute;left:4%;right:4%;bottom:2%;height:16%;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(23,22,26,.30),transparent 55%) center/40% 45% no-repeat,radial-gradient(closest-side,rgba(0,120,191,.55),rgba(0,120,191,.22) 50%,rgba(232,54,79,.14) 72%,transparent)}
.ud .pool.b{background:radial-gradient(closest-side,rgba(232,54,79,.30),rgba(0,120,191,.18) 60%,transparent);animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.ud .pool.b{animation:none;opacity:.6}}
:root[data-theme="dusk"] .ud .pool{background:radial-gradient(closest-side,rgba(98,190,247,.9),rgba(98,190,247,.32) 45%,rgba(240,112,138,.18) 70%,transparent);filter:blur(1.5px)}
:root[data-theme="dusk"] .ud .pool.b{background:radial-gradient(closest-side,rgba(240,112,138,.45),rgba(98,190,247,.2) 60%,transparent)}
.ud .stage img{filter:drop-shadow(0 0 1px rgba(255,255,255,.9)) drop-shadow(0 0 6px rgba(0,120,191,.45)) drop-shadow(0 0 3px rgba(232,54,79,.25)) drop-shadow(4px 8px 8px rgba(30,20,50,.16))}
:root[data-theme="dusk"] .ud .stage img{filter:drop-shadow(0 0 1px rgba(255,255,255,.75)) drop-shadow(0 0 7px rgba(98,190,247,.6)) drop-shadow(0 -1px 4px rgba(240,112,138,.35))}
@media (max-width:699px){.w small span:last-child{font-size:0}.w small span:last-child::after{content:attr(data-u);font-size:13px}}
@media (max-width:379px){.hero h1{font-size:26px}.go{grid-template-columns:minmax(0,1fr)}.go .btn2{white-space:normal}}
</style></head><body><div class="page" id="page"></div>
<script>
{const h=location.hash.slice(1).split('-');document.documentElement.dataset.theme=h[0]||'light';}
/*DATA*/
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m]);
function hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let h=0,s=0;if(d){s=d/(1-Math.abs(2*l-1));h=mx==r?((g-b)/d)%6:mx==g?(b-r)/d+2:(r-g)/d+4;h=(h*60+360)%360;}return[h,s,l];}
function norm(c){const[h,s0]=hsl(...c),s=Math.max(s0,.72),l=.56,C=(1-Math.abs(2*l-1))*s,X=C*(1-Math.abs((h/60)%2-1)),m=l-C/2,k=Math.floor(h/60)%6;return[[C,X,0],[X,C,0],[0,C,X],[0,X,C],[X,0,C],[C,0,X]][k].map(v=>Math.round((v+m)*255));}
async function hue(src){const im=new Image();im.src=src;await im.decode();const S=64,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');x.drawImage(im,0,0,S,S);const d=x.getImageData(0,0,S,S).data,B=Array.from({length:18},()=>[0,0,0,0]);
  for(let i=0;i<d.length;i+=4){if(d[i+3]<200)continue;const[h,s,l]=hsl(d[i],d[i+1],d[i+2]);if(s<.28||l<.2||l>.86)continue;const b=B[Math.floor(h/20)%18],w=s*s;b[0]+=d[i]*w;b[1]+=d[i+1]*w;b[2]+=d[i+2]*w;b[3]+=w;}
  const o=B.map(b=>b[3]?b.slice(0,3).map(v=>Math.round(v/b[3])):[150,150,165]).map((c,i)=>({c,w:B[i][3]})).sort((a,b)=>b.w-a.w);return o[0].c;}
(async()=>{
  const DK=document.documentElement.dataset.theme==='dusk';
  const cs=await Promise.all(D.top.map(t=>hue(t.img)));
  const header=`<header><div class="logo">${DK?D.logoD:D.logo}</div><nav><a>Home</a><a>Build</a><a class="on">My Team</a><a>Battle</a><a>Meta</a></nav><div class="s">Search</div></header>`;
  const slots=['Lead','Back','Bench'].map(r=>`<div class="grp ${r.toLowerCase()}"><div class="lab"><i></i>${r}</div><div class="two"><div class="slot"><i><b>+</b></i></div><div class="slot"><i><b>+</b></i></div></div></div>`).join('');
  const hero=`<section class="hero"><div><div class="eyebrow">My Team · no team yet</div><h1 class="u"><span>Six empty spots.</span><span class="pl">Start plotting.</span></h1>
    <p>Build a team, paste one from Showdown, or try the sample team to see how NastyPlot scores it.</p>
    <div class="go"><div class="btn main">Try the sample team</div><div class="btn2"><span>Paste from Showdown</span></div><div class="btn2"><span>Build from scratch</span></div></div>
    <p class="note">${esc(D.note)}</p></div><div class="slots">${slots}</div></section>`;
  const win=D.top.map((t,i)=>`<div class="w" style="--cp:${norm(cs[i]).join(',')}"><i class="sh"></i><img src="${t.img}" alt=""><b>${esc(t.d)}</b><small><span>Rated ${t.r}</span><span data-u="${t.u}% of teams"> · on ${t.u}% of teams</span></small></div>`).join('');
  const f=D.under;
  const ud=`<div class="ud"><div class="stage"><i class="pool"></i><i class="pool b"></i><img src="${f.img}" alt="${esc(f.d)}"></div><div>
    <div class="k">Today's underdog</div><h3 class="u">${esc(f.d)}. <span>Somebody's favourite.</span></h3>
    <p>Rarely picked in tournaments, but every Pokémon deserves its moment. Maybe it's yours?</p>
    <div class="row"><div class="btn main">Build around it</div><a>Info Sheet</a></div>
    <a class="fav">Or build around your favourite Pokémon <span aria-hidden="true">→</span></a></div></div>`;
  const more=`<section class="more"><div><h2 class="u">Or start from a winner</h2><p class="sub">Today's six highest-rated Pokémon. Pick one and build around it.</p><div class="win">${win}</div></div>${ud}</section>`;
  document.getElementById('page').innerHTML='<i class="grain"></i>'+header+'<main>'+hero+more+'</main>';
  await document.fonts.ready;document.body.dataset.ready=1;})();
</script></body></html>
