<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=Unbounded:wght@800;900&display=swap">
<link rel="stylesheet" href="tokens.css">
<style>
/* Ratings (R2, Meta > Pokémon ratings). Every feature of today's Ratings page (inventory D-meta-shell RATE-01..09, NAV-04/05) is here
   or one tap away. Rules: design-system.md 2b (floor rule, normalised colour, filled main action) and 9 (length).
   Reference: docs/rebuild/reference-2026-11-11 section 8. Real data from today's site (make-ratings.mjs). */
:root{--gut:max(96px,calc(50vw - 624px));--dockh:88px}
.page{position:relative;overflow:clip;padding-bottom:var(--dockh)}
header,.subnav,main,footer{position:relative;z-index:1}
header{height:76px;display:flex;align-items:center;gap:48px;padding:0 var(--gut)}header .logo svg{height:36px;display:block}
nav{display:flex;gap:36px}nav a{font:500 15px/1 var(--b);color:var(--ink-2)}
nav a.on{color:var(--ink);font-weight:700;position:relative}nav a.on::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:5px;background:var(--plot);transform:skewX(var(--slant))}
.hs{margin-left:auto;display:flex;align-items:center;gap:12px;width:360px;height:44px;padding:0 12px 0 18px;border:1.5px solid var(--ink);transform:skewX(-10deg);color:var(--ink-3);font:500 15px/1 var(--b)}
.hs>*{transform:skewX(10deg)}.hs svg{width:18px;height:18px;flex:none}.hs span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs kbd{flex:none;display:grid;place-items:center;width:24px;height:24px;border:1px solid var(--rule);border-radius:var(--r-s);font:600 13px/1 var(--b);color:var(--ink-2);background:var(--surface)}
.hs-btn{display:none}.hs .sm{display:none}
:root[data-theme="dusk"] .hs{border-color:rgba(228,224,236,.42)}
/* Meta switches (NAV-04 Pokémon | Tournaments, NAV-05 Rating / Usage / Sets) */
.subnav{display:flex;align-items:center;gap:32px;padding:4px var(--gut) 0}
.tabs{display:flex;gap:28px}.tabs a{position:relative;font:600 15px/44px var(--b);color:var(--ink-2)}
.tabs a.on{color:var(--ink);font-weight:700}.tabs a.on::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:4px;background:var(--plot);transform:skewX(var(--slant))}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:330px;height:44px;padding:4px;background:var(--wash);clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.seg a{display:flex;align-items:center;justify-content:center;gap:8px;font:600 15px/1 var(--b);color:var(--ink-2);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.seg a svg{width:16px;height:16px}.seg a.on{background:var(--plate);color:var(--on-plate)}
:root[data-theme="dusk"] .seg a.on{background:linear-gradient(180deg,#3E3D56,#2C2B3D);box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
/* work area: the featured Pokémon (left, sticky) beside the ranked list */
main{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:64px;padding:32px var(--gut) 48px;align-items:start}
.feat{align-self:stretch}#feat{position:sticky;top:24px}
.feat h1{font-size:56px;line-height:1.02;margin-top:16px}.feat h1 span{display:block;white-space:nowrap}.feat h1 .pl{color:var(--plot)}
.lede{font-size:17px;color:var(--ink-2);margin-top:16px;max-width:400px}
.facts{margin-top:8px;font:500 13px/1.5 var(--b);color:var(--ink-2)}.facts span.l{display:block}
.facts b{font-weight:700;color:var(--ink)}
.q{display:inline-grid;place-items:center;width:20px;height:20px;margin-left:4px;vertical-align:-4px;border:1.5px solid var(--ink-3);border-radius:50%;font:700 13px/1 var(--b);color:var(--ink-2)}
.links{display:flex;gap:24px;margin-left:auto;font:600 15px/1.2 var(--b);white-space:nowrap}.links a{color:var(--plot-text)}.links.in{display:none}
/* the featured one stands on the tilted panel in its normalised colour, on its pool (design-system 2b) */
.stage{position:relative;height:300px;margin-top:24px}
.stage .panel{position:absolute;left:0;right:0;top:84px;height:176px;transform:skewY(-7deg);border-radius:var(--r-m);
  background:linear-gradient(150deg,rgba(var(--cp),.9),rgba(var(--cp),.55));box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 1px 2px rgba(30,20,50,.12),0 8px 14px -6px rgba(30,20,50,.22),0 22px 30px -18px rgba(30,20,50,.3)}
.stage .pool{position:absolute;left:50%;bottom:22px;width:240px;height:44px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(closest-side,var(--contact),transparent 60%) center/46% 50% no-repeat,radial-gradient(closest-side,rgba(var(--cp),.7),rgba(var(--cp),.3) 55%,transparent)}
.stage img{position:absolute;left:50%;bottom:32px;width:264px;height:264px;transform:translateX(-50%);object-fit:contain;object-position:50% 100%;filter:drop-shadow(4px 8px 8px rgba(30,20,50,.2))}
.stage .plate{position:absolute;left:-6px;bottom:0;height:40px;padding:0 20px;display:flex;align-items:center;gap:10px;background:var(--plate);color:var(--on-plate);
  font:900 17px/1 var(--u);font-style:italic;box-shadow:var(--shadow-lift);clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);white-space:nowrap}
:root[data-theme="dusk"] .stage .panel{background:linear-gradient(150deg,rgba(var(--cp),.78),rgba(var(--cp),.34));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 0 1px rgba(var(--cp),.25),0 24px 50px -24px rgba(var(--cp),.6)}
:root[data-theme="dusk"] .stage .pool{background:radial-gradient(closest-side,rgba(var(--cp),.9),rgba(var(--cp),.32) 45%,transparent)}
:root[data-theme="dusk"] .stage img{filter:drop-shadow(0 0 .8px rgba(255,255,255,.6)) drop-shadow(0 14px 16px rgba(0,0,0,.45))}
:root[data-theme="dusk"] .stage .plate{background:linear-gradient(180deg,#3E3D56,#2C2B3D);color:#F1EDE7;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.35)}
.fname{margin-top:20px}.prk{display:none}.fname h3{font-size:28px;line-height:1.05}
.mg{display:block;font:700 13px/1 var(--b);font-style:italic;letter-spacing:.04em;text-transform:uppercase;color:var(--plot-text);margin-bottom:4px}
.fname .mg{font-family:var(--b);font-weight:700;font-size:13px;letter-spacing:.04em}
.types{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}.fname .types{margin-top:8px}
.ty{display:inline-flex;align-items:center;height:24px;padding:0 12px;font:700 13px/1 var(--b);background:var(--tc);color:var(--tt);clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%)}
.mine{display:inline-flex;align-items:center;gap:8px;font:600 13px/1 var(--b);color:var(--plot-text);white-space:nowrap}.mine::before{content:"";width:16px;height:6px;background:var(--plot);transform:skewX(var(--slant))}
.gem{font:700 13px/1 var(--b);color:var(--band-ready)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:20px;padding-top:16px;border-top:1px solid var(--rule)}
.stats dt{font:500 13px/1.3 var(--b);color:var(--ink-2)}.stats dd{margin-top:6px;font:900 28px/1 var(--u);font-style:italic;letter-spacing:-.02em}
.stats dd .unit{font-family:var(--b);font-style:normal;font-weight:600}.stats small{display:block;margin-top:6px;font:500 13px/1.3 var(--b);color:var(--ink-3)}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:center;gap:12px;margin-top:20px}.acts .btn{height:48px;padding:0 16px;white-space:nowrap}.acts .btn2{height:48px;padding:0 12px;white-space:nowrap}.acts .mine,.acts .add{grid-column:1/-1}
.acts .add{font:600 15px/1.2 var(--b);color:var(--plot-text)}
.hint .hp{display:none}.hint{margin-top:12px;font:400 13px/1.5 var(--b);color:var(--ink-3)}
/* the list */
.find{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.find .field{height:48px}.find .field svg{width:18px;height:18px;flex:none}.find .field span{flex:1;min-width:0;white-space:nowrap}
.find .sm{display:none}.find .cnt{font:600 15px/1 var(--b);color:var(--ink-2);white-space:nowrap}.find .cnt b{font:900 20px/1 var(--u);font-style:italic;color:var(--ink);margin-right:4px}
.filt{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px}.filt .lab{font:600 13px/1 var(--b);color:var(--ink-2);margin-right:4px;letter-spacing:.04em}
.filt .chip i{font-style:normal;margin-left:6px;color:var(--ink-3);font-weight:600}.filt .chip.on i{color:inherit;opacity:.75}
:root[data-theme="dusk"] .chip:not(.on){background:#262535}
.rk{--cols:36px 64px minmax(0,1fr) minmax(48px,120px) 52px 80px 88px;margin-top:20px}
.th,.row{display:grid;grid-template-columns:var(--cols);column-gap:14px;align-items:center}
.th .key{display:none}.th{height:40px;border-bottom:1px solid var(--rule);font:600 13px/1 var(--b);color:var(--ink-2)}.th .r{text-align:right}.th .c3{grid-column:3}.th .c4{grid-column:4/6;text-align:right}
.tierh{display:flex;align-items:center;gap:12px;height:52px;border-bottom:1px solid var(--rule);font:600 13px/1.3 var(--b);color:var(--ink-2)}
.tierh .chip{height:28px;padding:0 14px;font:700 13px/1 var(--b)}
.row{position:relative;height:72px;border-bottom:1px solid var(--rule);cursor:pointer;outline:none}
.row::before{content:"";position:absolute;inset:0 -12px;background:var(--surface);opacity:0;transition:opacity .15s;z-index:-1;border-radius:var(--r-s)}
.row.on::before,.row:hover::before,.row:focus-visible::before{opacity:1;box-shadow:0 1px 2px rgba(30,20,50,.06),0 10px 24px -14px rgba(30,20,50,.28)}
.row:focus-visible{box-shadow:inset 3px 0 0 var(--plot)}
.row .n{font:900 17px/1 var(--u);font-style:italic;color:var(--ink-3)}
.row .art{position:relative;width:64px;height:64px}
.row .art .sh{position:absolute;left:50%;bottom:4px;width:56px;height:12px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(closest-side,var(--contact),transparent 60%) center/46% 50% no-repeat,radial-gradient(closest-side,rgba(var(--cp),.5),rgba(var(--cp),.2) 55%,transparent)}
.row .art img{position:relative;width:64px;height:64px;object-fit:contain;object-position:50% 100%;padding-bottom:6px;filter:drop-shadow(2px 4px 4px rgba(30,20,50,.16))}
:root[data-theme="dusk"] .row .art .sh{background:radial-gradient(closest-side,rgba(var(--cp),.75),rgba(var(--cp),.25) 45%,transparent)}
:root[data-theme="dusk"] .row .art img{filter:drop-shadow(0 0 .6px rgba(255,255,255,.5))}
.who{min-width:0}.who .nl{display:flex;align-items:baseline;gap:12px;min-width:0}.who .mine{flex:none}.who b{font:700 17px/1.2 var(--b);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.who .mg{margin-bottom:2px}
.who .types{margin-top:6px;flex-wrap:nowrap}
.who .ph{display:none}
.bar{height:10px;background:var(--rule);transform:skewX(var(--slant))}.bar i{display:block;height:100%;background:var(--ink)}
:root[data-theme="dusk"] .bar i{background:#D6D1CA}
.row .r{font:900 24px/1 var(--u);font-style:italic;text-align:right;letter-spacing:-.02em}
:root[data-theme="dusk"] .row .r{color:#D6D1CA}
.row .p{text-align:right;font:600 17px/1 var(--b)}.row .p .unit,.row .p small{font-size:13px}.row .p small{display:block;margin-top:6px;font:500 13px/1 var(--b);color:var(--ink-3)}
.more{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 24px;margin-top:24px}
.more .btn{height:48px;padding:0 28px}
.tiers{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.tiers .lab{font:600 13px/1 var(--b);color:var(--ink-2);margin-right:4px;letter-spacing:.04em}
.tiers .chip b{font-weight:700;margin-right:8px}.tiers .chip i{font-style:normal;color:var(--ink-3);font-weight:600}
.legend{margin-top:12px;font:400 13px/1.5 var(--b);color:var(--ink-3)}
.fold{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:24px;padding:16px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);font:600 15px/1.4 var(--b)}
.fold small{display:block;font:400 13px/1.5 var(--b);color:var(--ink-2)}.fold i{font-style:normal;font-size:20px;color:var(--ink-3)}
footer{display:flex;align-items:center;gap:40px;padding:0 var(--gut);height:96px;border-top:1px solid var(--rule);font-size:15px;color:var(--ink-2)}footer svg{height:24px}footer .r{margin-left:auto;display:flex;gap:32px}
/* team dock: frosted, along the bottom of every page except My Team (reference section 8) */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;height:var(--dockh);display:flex;align-items:center;gap:32px;padding:0 var(--gut);
  background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);border-top:1px solid var(--rule)}
.dock .tn b{display:block;font:700 17px/1.2 var(--b);white-space:nowrap}.dock .tn small{display:block;font:500 13px/1.3 var(--b);color:var(--ink-2);white-space:nowrap}
.dock .sc{display:flex;align-items:baseline;gap:10px;white-space:nowrap}.dock .sc b{font:900 34px/1 var(--u);font-style:italic;letter-spacing:-.03em}
.dock .sc span{font:900 17px/1 var(--u);font-style:italic;color:var(--band-top)}.dock .sc small{display:block;font:500 13px/1 var(--b);color:var(--ink-2);margin-top:4px}
.dock .sc .w{display:flex;flex-direction:column}
:root[data-theme="dusk"] .dock .sc b{color:#D6D1CA}:root[data-theme="dusk"] .dock .sc span{text-shadow:0 0 18px rgba(79,178,240,.4)}
.dock .six{display:grid;grid-template-columns:repeat(6,56px);gap:12px}
.dock .six .m{position:relative;height:56px}.dock .six img{position:relative;width:56px;height:56px;object-fit:contain;object-position:50% 100%;padding-bottom:4px}
.dock .six .sh{position:absolute;left:50%;bottom:2px;width:48px;height:10px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(var(--cp),.55),rgba(var(--cp),.2) 55%,transparent)}
.dock .btn2{margin-left:auto;height:44px;white-space:nowrap}.dock .go{display:none}
/* iPad and narrow desktop windows: one column, the featured Pokémon becomes a band beside its numbers */
@media (max-width:1439px){:root{--gut:48px}main{grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:48px}.feat h1{font-size:48px}.stage{height:280px}.stage img{width:240px;height:240px}}

@media (max-width:779px){#feat{display:grid;grid-template-columns:260px minmax(0,1fr);column-gap:24px;align-items:center}#feat .info{display:contents}

/* phones */

  .rk{--cols:24px 56px minmax(0,1fr) 44px;margin-top:16px}.th .c3{grid-column:3}.th .c4{grid-column:4}.th .c6,.th .c7,.bar,.row .p{display:none}

@media (max-width:379px){.tiers{grid-template-columns:repeat(3,minmax(0,1fr))}.th .pk{display:none}.th .key{margin-left:0}.acts{grid-template-columns:minmax(0,1fr)}.find .lg{display:none}.find .sm{display:block}.ty{padding:0 10px}.who b{font-stretch:88%}.acts .btn,.acts .btn2{font-size:15px}.stats dd{font-size:22px}.feat h1{font-size:32px}}
/* section 9.5 (nothing cut off at the edge), as on My Box: below 900 the filter chips wrap instead of running under a fade */
@media (max-width:899px){.filt{flex-wrap:wrap!important;overflow:visible!important;-webkit-mask-image:none!important;mask-image:none!important;margin-right:0!important}}
</style></head><body><div class="page" id="page"></div>
<script>
document.documentElement.dataset.theme=location.hash.slice(1)||'light';
/*DATA*/
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m]);
const nm=d=>d.startsWith('Mega ')?`<span class="mg">Mega</span>${esc(d.slice(5))}`:esc(d);
const pct=v=>v==null?'–':(+v).toFixed(1)+'<span class="unit">%</span>';
function hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let h=0,s=0;if(d){s=d/(1-Math.abs(2*l-1));h=mx==r?((g-b)/d)%6:mx==g?(b-r)/d+2:(r-g)/d+4;h=(h*60+360)%360;}return[h,s,l];}
function norm(c){const[h,s0]=hsl(...c),s=Math.max(s0,.72),l=.56,C=(1-Math.abs(2*l-1))*s,X=C*(1-Math.abs((h/60)%2-1)),m=l-C/2,k=Math.floor(h/60)%6;return[[C,X,0],[X,C,0],[0,C,X],[0,X,C],[X,0,C],[C,0,X]][k].map(v=>Math.round((v+m)*255));}
async function hue(src){const im=new Image();im.src=src;await im.decode();const S=64,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');x.drawImage(im,0,0,S,S);const d=x.getImageData(0,0,S,S).data,B=Array.from({length:18},()=>[0,0,0,0]);
  for(let i=0;i<d.length;i+=4){if(d[i+3]<200)continue;const[h,s,l]=hsl(d[i],d[i+1],d[i+2]);if(s<.28||l<.2||l>.86)continue;const b=B[Math.floor(h/20)%18],w=s*s;b[0]+=d[i]*w;b[1]+=d[i+1]*w;b[2]+=d[i+2]*w;b[3]+=w;}
  const o=B.map((b,i)=>({c:b[3]?b.slice(0,3).map(v=>Math.round(v/b[3])):[150,150,165],w:b[3]})).sort((a,b)=>b.w-a.w);return o[0].c;}
/* type chip text: ink or white, whichever passes better on that type's colour (Electric, Ice, Ground, Fairy... take ink) */
const lum=h=>{const v=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(c=>c<=.03928?c/12.92:((c+.055)/1.055)**2.4);return .2126*v[0]+.7152*v[1]+.0722*v[2];};
const tyInk=h=>{const L=lum(h);return (1.05)/(L+.05)>=(L+.05)/(lum('#17161A')+.05)?'#fff':'#17161A';};
const ty=t=>{const c=(D.TC[t]||'#888888').toUpperCase().replace(/^#([0-9A-F])([0-9A-F])([0-9A-F])$/,'#$1$1$2$2$3$3');return `<span class="ty" style="--tc:${c};--tt:${tyInk(c)}">${esc(t)}</span>`;};
const I={search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2.8 2.8 6 6.5.6-4.9 4.3 1.5 6.4L12 16.8l-5.9 3.3 1.5-6.4-4.9-4.3 6.5-.6z"/></svg>',
  bars:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="6" width="4" height="15"/><rect x="17" y="9" width="4" height="12"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>'};
(async()=>{
  const DK=document.documentElement.dataset.theme==='dusk',CP={};
  await Promise.all([...D.top,...D.team.six].map(async m=>{CP[m.img]=CP[m.img]||norm(await hue(m.img)).join(',');}));
  const T0=D.tiers[0],touch=matchMedia('(hover:none)').matches;
  const header=`<header><div class="logo">${DK?D.logoD:D.logo}</div><nav><a>Home</a><a>Build</a><a>My Team</a><a>Battle</a><a class="on">Meta</a></nav>
    <div class="hs" role="search">${I.search}<span class="lg">Search Pokémon, tools, teams</span><span class="sm">Search everything</span><kbd title="Press / to search">/</kbd></div><a class="hs-btn" aria-label="Search">${I.search}</a></header>`;
  const subnav=`<div class="subnav"><div class="tabs"><a class="on">Pokémon</a><a>Tournaments</a></div>
    <div class="seg"><a class="on">${I.star}Rating</a><a>${I.bars}Usage</a><a>${I.list}Sets</a></div><div class="links top"><a>How ratings work →</a><a>Track Record →</a></div></div>`;
  const feat=m=>`<div class="stage" style="--cp:${CP[m.img]}"><i class="panel"></i><i class="pool"></i><img src="${m.img}" alt="${esc(m.d)}">
      <div class="plate">#${m.rank} · Rated ${m.r} · ${m.tier} tier</div></div>
    <div class="info"><div class="fname"><span class="prk">#${m.rank} · Rated ${m.r} · ${m.tier} tier</span><h3 class="u">${nm(m.d)}</h3><div class="types">${m.t.map(ty).join('')}${m.gem?'<span class="gem">◆ Hidden gem</span>':''}</div></div>
    <dl class="stats"><div><dt>Base Speed</dt><dd>${m.sp}</dd></div><div><dt>On teams</dt><dd>${pct(m.on)}</dd><small>of ${D.teams} teams</small></div>
      <div><dt>Win rate</dt><dd>${pct(m.wr)}</dd><small>${(m.games||0).toLocaleString('en-US')} games</small></div></dl>
    <div class="acts"><div class="btn main">Open info sheet</div><div class="btn2"><span>Build around it</span></div>${m.mine?'<span class="mine">On your team</span>':'<a class="add">Add to team</a>'}</div>
    <p class="hint"><span class="hw">${touch?'Tap any row and it steps up here.':'Point at any row and it steps up here.'} Nothing covers the list.</span><span class="hp">Tap any row for its info sheet.</span> Rated ${m.range}.</p></div>`;
  const aside=`<aside class="feat"><div class="intro"><div><div class="eyebrow">Meta · Ratings</div><h1 class="u"><span>Who wins</span><span class="pl">right now.</span></h1></div>
      <div><p class="lede">Every Pokémon rated 0–100 from real tournament results, not opinion.</p>
      <p class="facts"><span class="l"><b>${D.teams}</b> teams · <b>${D.events}</b> events · <b>${D.games}</b> games</span><span class="l">Reg M‑C doubles · data as of <b>${esc(D.asOf)}</b><span class="q" title="How to read our numbers">?</span></span></p><div class="links in"><a>How ratings work →</a><a>Track Record →</a></div></div></div>
    <div id="feat">${feat(D.top[0])}</div></aside>`;
  const row=(m,i)=>`<div class="row${i?'':' on'}" tabindex="0" role="button" data-i="${i}" style="--cp:${CP[m.img]}" aria-label="${esc(m.d)}, rated ${m.r}, rank ${m.rank}">
      <span class="n">${m.rank}</span><span class="art"><i class="sh"></i><img src="${m.img}" alt=""></span>
      <span class="who">${m.d.startsWith('Mega ')?'<span class="mg">Mega</span>':''}<span class="nl"><b>${esc(m.d.replace(/^Mega /,''))}</b>${m.mine?'<span class="mine"><span class="t">On your team</span></span>':''}</span><span class="types">${m.t.map(ty).join('')}</span>
        <span class="ph"><b>${(+m.on).toFixed(1)}%</b> on teams · <b>${(+m.wr).toFixed(1)}%</b> win rate</span></span>
      <span class="bar"><i style="width:${m.r}%"></i></span><span class="r">${m.r}</span>
      <span class="p">${pct(m.on)}</span><span class="p">${pct(m.wr)}<small>${(m.games/1000).toFixed(1)}k games</small></span></div>`;
  const tierHead=k=>{const T=D.tiers.find(t=>t.k===k);return `<div class="tierh"><span class="chip on">${T.k} tier</span><span>${T.band} · ${esc(T.d)} · ${T.n} Pokémon${k==='S'?`<span class="ra">, ranked among ${D.of} with results</span>`:''}</span></div>`;};
  let rows='';D.top.forEach((m,i)=>{if(!i||m.tier!==D.top[i-1].tier)rows+=tierHead(m.tier);rows+=row(m,i);});
  const list=`<section class="list">
    <div class="find"><div class="field">${I.search}<span class="lg">Find a Pokémon or type</span><span class="sm">Pokémon or type</span></div><span class="cnt"><b>${D.all}</b>rated</span></div>
    <div class="filt"><span class="lab">Filter</span><span class="chip on">All</span><span class="chip">Megas</span><span class="chip">No Megas</span><span class="chip">◆ Hidden gems<i>${D.gems.length}</i></span><span class="chip">In my box</span><span class="chip">Types<i>18</i></span></div>
    <div class="rk"><div class="th"><span class="c3"><span class="pk">Pokémon</span><span class="mine key"><span class="t">On your team</span></span></span><span class="c4">Rating</span><span class="r c6">On teams</span><span class="r c7">Win rate</span></div>${rows}</div>
    <div class="more"><div class="btn">See all ${D.all} Pokémon</div>
      <div class="tiers"><span class="lab">By tier</span>${D.tiers.map(t=>`<span class="chip"><b>${t.k}</b><i>${t.n}</i></span>`).join('')}</div></div>
    <p class="legend">Top ${D.top.length} of ${D.all} shown, ranked among ${D.of} with tournament results · ◆ hidden gem: rarely used, wins more than its use predicts · ? few games, an estimate</p>
    <div class="fold"><div>About the ratings<small>How they are made, the 4 data sources and their track record</small></div><i>+</i></div></section>`;
  const T=D.team;
  const dock=`<div class="dock"><div class="tn"><b>${esc(T.name)}</b><small>My Team · ${esc(T.style)}</small></div>
    <div class="sc"><b>${T.score}</b><span class="w"><span>${esc(T.band)}</span><small>Strength Score</small></span></div>
    <div class="six">${T.six.map(m=>`<span class="m" style="--cp:${CP[m.img]}"><i class="sh"></i><img src="${m.img}" alt=""></span>`).join('')}</div>
    <div class="btn2"><span>Open My Team</span></div><a class="go" aria-label="Open My Team">›</a></div>`;
  const footer=`<footer>${DK?D.logoD:D.logo}<span>NastyPlot is an unofficial, fan-made tool.</span><div class="r"><span>How We Calculate</span><span>About</span><span>Send Feedback</span></div></footer>`;
  document.getElementById('page').innerHTML='<i class="grain"></i>'+header+subnav+'<main>'+aside+list+'</main>'+footer+dock;
  /* pointing at a row (or tapping it on touch) brings that Pokémon up in the featured column; nothing pops up over the list */
  const show=i=>{document.querySelectorAll('.row').forEach(r=>r.classList.toggle('on',+r.dataset.i===i));document.getElementById('feat').innerHTML=feat(D.top[i]);};
  document.querySelectorAll('.row').forEach(r=>{const i=+r.dataset.i;r.addEventListener('mouseenter',()=>show(i));r.addEventListener('focus',()=>show(i));r.addEventListener('click',()=>show(i));});
  addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement===document.body){e.preventDefault();document.querySelector('.hs').focus?.();}});
  await document.fonts.ready;document.body.dataset.ready=1;})();
</script></body></html>
