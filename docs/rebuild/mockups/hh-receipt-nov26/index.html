<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rate your Pokémon Champions team · NastyPlot</title>
<style>
@font-face{font-family:U;src:url(unb.woff2) format('woff2');font-weight:200 900;font-display:block}
@font-face{font-family:I;src:url(ins.woff2) format('woff2');font-weight:400 700;font-display:block}
:root{--bg:#FBFAF7;--ink:#17161A;--ink2:#48454F;--plot:#0078BF;--plott:#0068AD;--pink:#E8364F;--paper:#FFFFFF;--line:#d9d5cc;--shade:rgba(23,22,26,.18)}
@media (prefers-color-scheme:dark){:root{--bg:#14131C;--ink:#F1EEE9;--ink2:#C4BFCB;--plot:#62BEF7;--plott:#62BEF7;--paper:#FFFDF8;--line:#ddd8cf;--shade:rgba(0,0,0,.5)}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:400 16px/1.5 I,system-ui,sans-serif;overflow-x:hidden}
.u{font-family:U;font-weight:800;font-style:italic;font-synthesis:style;letter-spacing:-.02em}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 48px;position:relative;z-index:5}
header img{height:40px}header nav{display:flex;gap:28px;font-weight:600;font-size:15px}header nav a{color:var(--ink);text-decoration:none}
.hero{position:relative;min-height:calc(100vh - 80px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:center;gap:24px;padding:0 48px 40px;overflow:hidden}
.words{position:relative;z-index:4;max-width:640px}
.kick{display:inline-block;background:var(--ink);color:var(--bg);font-size:15px;padding:4px 12px;transform:skewX(-12deg)}
.kick>span{display:inline-block;transform:skewX(12deg)}
h1{font-size:clamp(40px,5vw,76px);line-height:1.02;margin:16px 0}
h1 em{font-style:inherit;color:var(--plott)}
.lede{font-size:17px;color:var(--ink2);max-width:520px;margin:0 0 24px}
.btns{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.go{display:inline-block;background:var(--pink);color:#fff;font-size:28px;padding:12px 32px;text-decoration:none;transform:skewX(-10deg);box-shadow:8px 8px 0 var(--ink)}
.go>span,.go2>span{display:inline-block;transform:skewX(10deg)}
.go2{display:inline-block;border:3px solid var(--ink);color:var(--ink);font-size:17px;padding:8px 20px;text-decoration:none;transform:skewX(-10deg)}
.md{margin-top:24px;border-left:5px solid var(--pink);padding-left:12px;font-weight:600;font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.legend b{font:700 13px/1 I;color:#fff;padding:4px 10px;transform:skewX(-10deg)}
/* receipt */
.rc{position:relative;z-index:3;width:min(440px,100%);background:var(--paper);color:#17161A;padding:24px 24px 76px;box-shadow:16px 20px 0 var(--shade);
 clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),95% 100%,90% calc(100% - 12px),85% 100%,80% calc(100% - 12px),75% 100%,70% calc(100% - 12px),65% 100%,60% calc(100% - 12px),55% 100%,50% calc(100% - 12px),45% 100%,40% calc(100% - 12px),35% 100%,30% calc(100% - 12px),25% 100%,20% calc(100% - 12px),15% 100%,10% calc(100% - 12px),5% 100%,0 calc(100% - 12px))}
.rc .top{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px dashed #cfcac0;padding-bottom:8px}
.rc .top .u{font-size:22px}.rc .top small{font:700 13px I;letter-spacing:.08em}
.rc .meta{font-size:13px;margin:8px 0 4px;color:#48454F}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:8px;padding:4px 0;border-bottom:1px dotted #cfcac0;position:relative}
.row img{width:44px;height:44px;object-fit:contain}
.row .n{font-weight:700;font-size:15px;line-height:1.2}.row .n small{display:block;font-weight:400;font-size:13px;color:#48454F}
.row .r{font-size:28px;color:var(--c);display:flex;align-items:center;gap:8px}
.row .t{font:700 13px/1 I;font-style:normal;color:#fff;background:var(--c);padding:4px 8px;transform:skewX(-10deg);letter-spacing:0}
.tot{display:grid;grid-template-columns:1fr auto;align-items:end;margin-top:12px}
.tot .big{font-size:96px;line-height:.9;color:var(--pink)}.tot .big small{font-size:22px;color:#17161A}
.tot .band{font-size:17px}
.bars{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:12px}
.bars i{height:12px;transform:skewX(-20deg);background:#e6e2da}.bars i.on{background:linear-gradient(90deg,#f06428,#6a3cee,#f28cc0);height:20px;margin-top:-4px}
.bars span{font-size:13px;color:#48454F}
.stamp{position:absolute;left:20px;bottom:22px;z-index:7;border:4px solid var(--pink);color:var(--pink);font-size:20px;padding:4px 12px;transform:rotate(-12deg);background:rgba(255,255,255,.85)}
.vswitch{position:fixed;bottom:12px;right:12px;z-index:9;display:flex;gap:6px}.vswitch a{background:var(--ink);color:var(--bg);font:700 13px I;padding:6px 10px;text-decoration:none}
@media (max-width:899.98px){header{padding:16px}header nav{display:none}.hero{grid-template-columns:1fr;padding:8px 16px 40px;min-height:0}.rc{margin:0 auto}}

/* ===== V1: TEAM BANNER (six type stripes, each Pokémon big in its own colour) ===== */
.v1 .stage{position:absolute;inset:0 0 0 46%;display:grid;grid-template-columns:repeat(6,1fr);transform:skewX(-10deg);transform-origin:bottom}
.v1 .st{position:relative;background:var(--c);overflow:hidden;border-left:4px solid var(--bg)}
.v1 .st img{position:absolute;width:190%;left:-45%;top:4%;transform:skewX(10deg);filter:drop-shadow(0 8px 0 rgba(0,0,0,.25))}
.v1 .st b{position:absolute;bottom:16px;left:50%;transform:translateX(-50%) skewX(10deg);color:#fff;font:800 13px/1 U;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.v1 .rcwrap{position:relative;z-index:3;justify-self:end;margin-right:4%;transform:rotate(-3deg);margin-top:120px}
@media (max-width:899.98px){.v1 .stage{position:relative;inset:auto;height:260px;margin:0 -16px;order:2}.v1 .rcwrap{order:3;margin:-120px auto 0;justify-self:center}.v1 .words{order:1}}

/* ===== V2: STICKER BOMB (the six as die-cut stickers slapped on the receipt) ===== */
.v2 .hero{background:
 linear-gradient(115deg,transparent 0 58%,var(--plot) 58% 100%)}
.v2 .conf{position:absolute;inset:0;pointer-events:none;z-index:1}
.v2 .conf i{position:absolute;width:28px;height:10px;transform:skewX(-20deg) rotate(var(--a));background:var(--c);opacity:.9}
.v2 .rcwrap{position:relative;z-index:3;justify-self:center;transform:rotate(2deg);margin:40px 0}
.v2 .stk{position:absolute;z-index:4;width:var(--w);transform:rotate(var(--a));filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(6px 8px 0 rgba(0,0,0,.25))}
.v2 .tag{position:absolute;z-index:5;font-size:24px;color:#fff;background:var(--c);padding:2px 12px;transform:rotate(var(--a)) skewX(-10deg);box-shadow:4px 4px 0 #17161A;border:3px solid #fff}
.v2 .tag small{font:700 13px I;margin-left:6px}
.v2 .tot .big{visibility:hidden}
.v2 .burst{position:absolute;z-index:6;right:-10px;bottom:40px;width:150px;height:150px;background:var(--pink);color:#fff;display:grid;place-items:center;text-align:center;
 clip-path:polygon(50% 0,61% 18%,82% 8%,80% 30%,100% 38%,85% 54%,98% 72%,76% 76%,72% 98%,54% 86%,38% 100%,32% 80%,10% 84%,18% 64%,0 50%,16% 36%,6% 16%,28% 18%,38% 0);transform:rotate(8deg)}
.v2 .burst .u{font-size:56px;line-height:.9}.v2 .burst small{font:700 13px I}
@media (max-width:899.98px){.v2 .hero{background:linear-gradient(170deg,transparent 0 62%,var(--plot) 62% 100%)}.v2 .burst{right:-8px;width:120px;height:120px}.v2 .burst .u{font-size:44px}}

/* ===== V3: THE BURST (comic speed rays in the team's type colours, the six flying out) ===== */
.v3 .rays{position:absolute;z-index:0;left:52%;top:-20%;width:140vmax;height:140vmax;transform:translate(-20%,-10%);
 background:repeating-conic-gradient(from 0deg at 50% 50%,#f06428 0 10deg,#FBFAF7 10deg 15deg,#6a3cee 15deg 25deg,#FBFAF7 25deg 30deg,#f28cc0 30deg 40deg,#FBFAF7 40deg 45deg,#c6a53a 45deg 55deg,#FBFAF7 55deg 60deg,#f24f80 60deg 70deg,#FBFAF7 70deg 75deg,#5f4536 75deg 85deg,#FBFAF7 85deg 90deg);
 -webkit-mask:radial-gradient(circle at 50% 50%,#000 0 30%,transparent 60%);mask:radial-gradient(circle at 50% 50%,#000 0 30%,transparent 60%)}
@media (prefers-color-scheme:dark){.v3 .rays{filter:brightness(.85)}}
.v3 .rcwrap{position:relative;z-index:3;justify-self:center;transform:rotate(-4deg);margin:56px 0}
.v3 .fly{position:absolute;z-index:4;width:var(--w);transform:rotate(var(--a));filter:drop-shadow(8px 10px 0 rgba(0,0,0,.22))}
.v3 .lbl{position:absolute;z-index:5;color:#fff;background:var(--c);font-size:17px;padding:2px 10px;transform:skewX(-12deg);box-shadow:4px 4px 0 #17161A}
.v3 h1{text-shadow:none}
@media (max-width:899.98px){.v3 .rays{left:50%;top:30%}}
@media (prefers-reduced-motion:no-preference){
 .anim .rcwrap{animation:up .7s cubic-bezier(.2,1.4,.4,1) both}
 .anim .stamp{animation:slam .35s 1.1s cubic-bezier(.3,1.6,.5,1) both}
 .anim .stk,.anim .fly{animation:pop .45s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(.25s + var(--d,0s))}
 .anim .tag,.anim .lbl{animation:pop .35s both;animation-delay:calc(.55s + var(--d,0s))}
}
@keyframes up{from{transform:translateY(60px) rotate(-10deg);opacity:0}}
@keyframes slam{from{transform:scale(2.4) rotate(-30deg);opacity:0}}
@keyframes pop{from{transform:scale(.2) rotate(-40deg);opacity:0}}
</style>
</head>
<body>
<header><img src="logo.svg" alt="NastyPlot"><nav><a href="#">Home</a><a href="#">Build</a><a href="#">My Team</a><a href="#">Battle</a><a href="#">Meta</a></nav></header>
<main class="hero anim" id="hero"></main>
<div class="vswitch"><a href="?v=1">1</a><a href="?v=2">2</a><a href="?v=3">3</a></div>
<script>
const T={Fire:'#f06428',Rock:'#c6a53a',Dragon:'#6a3cee',Psychic:'#f24f80',Fairy:'#f28cc0',Dark:'#5f4536',Flying:'#8b8af2',Ground:'#e2b14a',Normal:'#aba88a',Steel:'#9db0cc'};
const SIX=[['Mega Charizard Y','Mega Stone','Fire',94,10035],['Mega Aerodactyl','Mega Stone','Rock',66,10042],['Garchomp','Life Orb','Dragon',92,445],['Farigiraf','Sitrus Berry','Psychic',89,981],['Sylveon','Fairy Feather','Fairy',85,700],['Kingambit','Focus Sash','Dark',97,983]];
const v=+(new URLSearchParams(location.search).get('v')||1);document.body.className='v'+v;
const words=`<div class="words"><span class="kick u"><span>Team builder · Strength Score</span></span>
<h1 class="u">Rate your Pokémon Champions team <em>before Reg M-D.</em></h1>
<p class="lede">Add your six. NastyPlot rings it up out of 100 against 17,606 real tournament teams, then shows its Matchups and exactly what to change.</p>
<div class="btns"><a class="go u" href="#"><span>Score My Team</span></a><a class="go2 u" href="#"><span>Build Me a Team</span></a></div>
<p class="md">Reg M-D starts Dec 2. Reg M-C ends Dec 2, 1:59 AM, with the balance patch.</p>
<div class="legend">${SIX.map(s=>`<b style="background:${T[s[2]]}">${s[2]}</b>`).filter((x,i,a)=>a.indexOf(x)===i).join('')}</div></div>`;
const rc=`<div class="rc"><div class="top"><span class="u">NastyPlot</span><small>STRENGTH SCORE RECEIPT</small></div>
<div class="meta">Winning team · Alpensee Tour (Reg M-C) #85 · Nov 25 · 128 players</div>
${SIX.map(s=>`<div class="row" style="--c:${T[s[2]]}"><img src="${s[4]}.webp" alt=""><div class="n">${s[0]}<small>${s[1]}</small></div><div class="r u"><span class="t">${s[2]}</span>${s[3]}</div></div>`).join('')}
<div class="bars"><i></i><i></i><i></i><i class="on"></i><i></i></div>
<div class="tot"><div class="u band">Strength Score<br><span style="color:var(--plott)">Tournament ready</span></div><div class="u big">87<small>/100</small></div></div>
<div class="stamp u">Reg M-D · Dec 2</div></div>`;
let art='';
if(v===1){art=`<div class="stage" aria-hidden="true">${SIX.map(s=>`<div class="st" style="--c:${T[s[2]]}"><img src="${s[4]}.webp" alt=""><b>${s[2]}</b></div>`).join('')}</div><div class="rcwrap">${rc}</div>`;}
if(v===2){const pos=[[-170,-40,150,-14],[400,-40,130,12],[-180,220,150,8],[410,190,150,-10],[-170,440,140,-6],[400,420,150,14]];
 const conf=Array.from({length:40},(_,i)=>`<i style="left:${55+(i*37)%45}%;top:${(i*53)%100}%;--a:${(i*47)%180}deg;--c:${T[SIX[i%6][2]]}"></i>`).join('');
 art=`<div class="conf" aria-hidden="true">${conf}</div><div class="rcwrap">${rc}${SIX.map((s,i)=>{const[x,y,w,a]=pos[i];return `<img class="stk" src="${s[4]}.webp" alt="" style="left:${x}px;top:${y}px;--w:${w}px;--a:${a}deg;--d:${i*.12}s"><span class="tag u" style="left:${x+w*.45}px;top:${y+w*.78}px;--a:${-a/2}deg;--c:${T[s[2]]};--d:${i*.12}s">${s[3]}<small>${s[2]}</small></span>`}).join('')}<div class="burst" aria-hidden="true"><div><div class="u">87</div><small>out of 100</small></div></div></div>`;}
if(v===3){const pos=[[-230,-60,180,-12],[430,-80,160,10],[-250,230,170,8],[450,190,180,-8],[-200,470,160,-4],[440,470,170,12]];
 art=`<div class="rays" aria-hidden="true"></div><div class="rcwrap">${rc}${SIX.map((s,i)=>{const[x,y,w,a]=pos[i];return `<img class="fly" src="${s[4]}.webp" alt="" style="left:${x}px;top:${y}px;--w:${w}px;--a:${a}deg;--d:${i*.1}s"><span class="lbl u" style="left:${x+16}px;top:${y+w-8}px;--c:${T[s[2]]};--d:${i*.1}s">${s[0]} ${s[3]}</span>`}).join('')}</div>`;}
document.getElementById('hero').innerHTML=words+art;
</script>
</body>
</html>
