.v11 .bar img{position:absolute;left:calc(100% + 8px);bottom:-18px;height:80px;width:auto;max-width:100px;object-fit:contain;transform:skewX(14deg);filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(0 0 14px var(--c))}
.v11 .ft{position:relative;width:330px;padding:12px 20px 44px;color:#17161A;display:grid;grid-template-columns:1fr auto;align-items:end}
.v11 .ft .big{font-size:68px;line-height:.85;color:var(--pink)}.v11 .ft .big small{font-size:22px;color:#17161A}
.v11 .ft .stamp{position:absolute;left:auto;right:-260px;bottom:52px;background:#14131C;border-color:#E8364F;color:#E8364F}
.v11 .scale{position:absolute;left:346px;right:0;bottom:6px;display:flex;justify-content:space-between;color:rgba(255,255,255,.55);font:700 13px I}
@media (max-width:899.98px){.fin .panel,.fin .rays,.fin .dots{display:none}.fin .rcwrap,.v11 .pr{background:var(--pbg);margin:24px -16px 0;padding:40px 16px 48px;transform:none;clip-path:polygon(0 24px,100% 0,100% 100%,0 100%)}.fin .rcwrap .rc{transform:rotate(-3deg)}.fin .bfly,.fin .btag{display:none}
 .v11 .pr{justify-self:stretch;width:calc(100% + 32px);max-width:none}.v11 .paper{width:auto;right:16px;left:16px;top:40px;bottom:48px}.v11 .hd,.v11 .ft{width:auto;margin:0 16px}.v11 .pl{grid-template-columns:1fr;height:auto;margin:0 16px;padding:8px 0}.v11 .pl .lab{height:auto;border:0;padding:0 16px}.v11 .pl .lab img{display:none}
 .v11 .bar{margin:6px 72px 6px 16px;height:34px;width:calc((var(--r) - 40) / 60 * (100% - 80px))}.v11 .bar .r{font-size:22px}.v11 .bar img{height:48px;bottom:-10px}.v11 .ft .big{font-size:60px}.v11 .ft .stamp{position:static;display:inline-block;margin-top:12px;grid-column:1/-1;justify-self:start}.v11 .scale{display:none}}
@media (prefers-reduced-motion:no-preference){
 .anim .rcwrap{animation:up .7s cubic-bezier(.2,1.4,.4,1) both}
 .anim .stamp{animation:slam .35s 1.1s cubic-bezier(.3,1.6,.5,1) both}
 .anim .stk,.anim .fly,.anim .bfly,.anim .sk{animation:pop .45s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(.25s + var(--d,0s))}
 .anim .tag,.anim .lbl,.anim .btag{animation:pop .35s both;animation-delay:calc(.55s + var(--d,0s))}
}
@keyframes up{from{transform:translateY(60px) rotate(-10deg);opacity:0}}
@keyframes slam{from{transform:scale(2.4) rotate(-30deg);opacity:0}}
@keyframes pop{from{transform:scale(.2) rotate(-40deg);opacity:0}}

<body>
<header><img src="logo.svg" alt="NastyPlot"><nav><a href="#">Home</a><a href="#">Build</a><a href="#">My Team</a><a href="#">Battle</a><a href="#">Meta</a></nav></header>
<main class="hero anim" id="hero"></main>
<div class="vswitch"><a href="?v=1">1</a><a href="?v=2">2</a><a href="?v=3">3</a><a href="?v=4">4</a><a href="?v=5">5</a><a href="?v=6">6</a><a href="?v=7">7</a><a href="?v=8">8</a><a href="?v=9">9</a><a href="?v=10">10</a><a href="?v=11">11</a></div>
<script>
const T={Fire:'#f06428',Rock:'#c6a53a',Dragon:'#6a3cee',Psychic:'#f24f80',Fairy:'#f28cc0',Dark:'#5f4536',Flying:'#8b8af2',Ground:'#e2b14a',Normal:'#aba88a',Steel:'#9db0cc'};
const SIX=[['Mega Charizard Y','Mega Stone','Fire',94,10035],['Mega Aerodactyl','Mega Stone','Rock',66,10042],['Garchomp','Life Orb','Dragon',92,445],['Farigiraf','Sitrus Berry','Psychic',89,981],['Sylveon','Fairy Feather','Fairy',85,700],['Kingambit','Focus Sash','Dark',97,983]];
const v=+(new URLSearchParams(location.search).get('v')||1);document.body.className='v'+v+(v>=9?' fin':'');
const words=`<div class="words"><span class="kick u"><span>Team builder · Strength Score</span></span>
<h1 class="u">Rate your Pokémon Champions team <em>before Reg M-D.</em></h1>
<p class="lede">Add your six. NastyPlot rings it up out of 100 against 17,606 real tournament teams, then shows its Matchups and exactly what to change.</p>
<div class="btns"><a class="go u" href="#"><span>Score My Team</span></a><a class="go2 u" href="#"><span>Build Me a Team</span></a></div>
<p class="md">Reg M-D starts Dec 2. Reg M-C ends Dec 2, 1:59 AM, with the balance patch.</p>
<div class="legend">${SIX.map(s=>`<b style="background:${T[s[2]]}">${s[2]}</b>`).filter((x,i,a)=>a.indexOf(x)===i).join('')}</div></div>`;
const rc=`<div class="rc"><div class="top"><span class="u">NastyPlot</span><small>STRENGTH SCORE RECEIPT</small></div>
<div class="meta">Winning team · Alpensee Tour (Reg M-C) #85 · Nov 25 · 128 players</div>
${SIX.map(s=>`<div class="row" style="--c:${T[s[2]]}"><img src="${s[4]}.webp" alt=""><div class="n">${s[0]}<small>${s[1]}</small></div><div class="r u"><span class="t">${s[2]}</span>${s[3]}</div></div>`).join('')}
<div class="bars"><i></i><i></i><i></i><i class="on"></i><i></i></div>
<div class="tot"><div class="u band">Strength Score<br><span style="color:var(--plott)">Tournament ready</span></div><div class="u big">87<small>/100</small></div></div>
<div class="stamp u">Reg M-D · Dec 2</div></div>`;
let art='';
if(v===1){art=`<div class="stage" aria-hidden="true">${SIX.map(s=>`<div class="st" style="--c:${T[s[2]]}"><img src="${s[4]}.webp" alt=""><b>${s[2]}</b></div>`).join('')}</div><div class="rcwrap">${rc}</div>`;}
if(v===2){const pos=[[-170,-40,150,-14],[400,-40,130,12],[-180,220,150,8],[410,190,150,-10],[-170,440,140,-6],[400,420,150,14]];
 const conf=Array.from({length:40},(_,i)=>`<i style="left:${55+(i*37)%45}%;top:${(i*53)%100}%;--a:${(i*47)%180}deg;--c:${T[SIX[i%6][2]]}"></i>`).join('');
 art=`<div class="conf" aria-hidden="true">${conf}</div><div class="rcwrap">${rc}${SIX.map((s,i)=>{const[x,y,w,a]=pos[i];return `<img class="stk" src="${s[4]}.webp" alt="" style="left:${x}px;top:${y}px;--w:${w}px;--a:${a}deg;--d:${i*.12}s"><span class="tag u" style="left:${x+w*.45}px;top:${y+w*.78}px;--a:${-a/2}deg;--c:${T[s[2]]};--d:${i*.12}s">${s[3]}<small>${s[2]}</small></span>`}).join('')}<div class="burst" aria-hidden="true"><div><div class="u">87</div><small>out of 100</small></div></div></div>`;}
if(v===3){const pos=[[-230,-60,180,-12],[430,-80,160,10],[-250,230,170,8],[450,190,180,-8],[-200,470,160,-4],[440,470,170,12]];
 art=`<div class="rays" aria-hidden="true"></div><div class="rcwrap">${rc}${SIX.map((s,i)=>{const[x,y,w,a]=pos[i];return `<img class="fly" src="${s[4]}.webp" alt="" style="left:${x}px;top:${y}px;--w:${w}px;--a:${a}deg;--d:${i*.1}s"><span class="lbl u" style="left:${x+16}px;top:${y+w-8}px;--c:${T[s[2]]};--d:${i*.1}s">${s[0]} ${s[3]}</span>`}).join('')}</div>`;}

const P6=[[-215,-40,170,-10],[440,-70,110,10],[-250,240,165,6],[450,200,110,-8],[-205,470,150,-4],[445,450,115,10]];
const flyers=(cls,list,tagged)=>SIX.map((s,i)=>{const[x,y,w,a]=list[i];return `<img class="${cls}" src="${s[4]}.webp" alt="" style="left:${x}px;top:${y}px;--w:${w}px;--a:${a}deg;--d:${i*.1}s">`+(tagged&&x<300?`<span class="btag u" style="left:${x>300?x-110:x+10}px;top:${y+w-14}px;--a:${-a/3}deg;--c:${T[s[2]]};--d:${i*.1}s">${s[0]} ${s[3]}<i>${s[2]}</i></span>`:'')}).join('');
if(v===4){art=`<div class="rays" aria-hidden="true"></div><div class="dots" aria-hidden="true"></div><div class="rcwrap">${rc}${flyers('bfly',P6,true)}</div>`;}
if(v===5){const P3=[[-250,-80,220,-8],[440,30,140,8],[440,380,140,6]];
 art=`<div class="rays" aria-hidden="true"></div><div class="rcwrap">${rc}${[0,2,5].map((k,j)=>{const s=SIX[k],[x,y,w,a]=P3[j];return `<img class="bfly" src="${s[4]}.webp" alt="" style="left:${x}px;top:${y}px;--w:${w}px;--a:${a}deg;--d:${j*.12}s">${x>300?'':`<span class="btag u" style="left:${x+16}px;top:${y+w-16}px;--a:0deg;--c:${T[s[2]]};--d:${j*.12}s">${s[0]} ${s[3]}<i>${s[2]}</i></span>`}`}).join('')}</div>`;}
if(v===6){art=`<div class="panel" aria-hidden="true"></div><div class="rays" aria-hidden="true"></div><div class="dots" aria-hidden="true"></div><div class="rcwrap">${rc}${flyers('bfly',P6,true)}</div>`;}
if(v===7){const PK=[[-190,-30,150,-8],[440,-50,110,8],[-205,250,150,6],[450,210,110,-6],[-185,480,140,-5],[445,460,115,7]];
 const stars=[[-60,600,'#E8364F'],[480,150,'#FBFAF7'],[520,400,'#f7c815'],[-110,170,'#0078BF']].map(([x,y,c])=>`<i class="star" style="left:${x}px;top:${y}px;--c:${c}"></i>`).join('');
 art=`<div class="slab" aria-hidden="true"></div><div class="rcwrap">${rc}${stars}${SIX.map((s,i)=>{const[x,y,w,a]=PK[i];return `<span class="sk${i===1?' peel':''}" style="left:${x}px;top:${y}px;--w:${w}px;--a:${a}deg;--c:${T[s[2]]};--d:${i*.1}s"><img src="${s[4]}.webp" alt=""><b class="u">${s[3]}<small>${s[2]}</small></b></span>`}).join('')}</div>`;}
if(v===8){const rows=SIX.map(s=>`<div class="pl" style="--c:${T[s[2]]};--r:${s[3]};--len:calc(${Math.round((s[3]-40)/60*100)}% - 90px)"><div class="lab"><img src="${s[4]}.webp" alt="" style="width:36px;height:36px;object-fit:contain"><div class="n">${s[0]}<small>${s[1]}</small></div><span class="t">${s[2]}</span></div><div class="bar" role="img" aria-label="${s[0]}, Rating ${s[3]}"><span class="r u">${s[3]}</span><img src="${s[4]}.webp" alt=""></div></div>`).join('');
 art=`<div class="pr"><div class="paper"></div><div class="axis"></div><div class="hd"><span class="u">NastyPlot</span><span style="float:right;font:700 13px/2 I;letter-spacing:.06em">RECEIPT</span><small>Winning team · Alpensee Tour (Reg M-C) #85 · Nov 25 · 128 players</small></div>${rows}<div class="ft"><div class="u" style="font-size:17px">Strength Score<br><span style="color:var(--plott)">Tournament ready</span></div><div class="u big">87<small>/100</small></div><div class="stamp u">Reg M-D · Dec 2</div></div></div>`;}

const PF=[[-215,-30,170,-10],[440,-20,110,10],[-250,240,165,6],[450,220,110,-8],[-205,470,150,-4],[445,460,115,10]];
const finFly=()=>SIX.map((s,i)=>{const[x,y,w,a]=PF[i];return `<img class="bfly" src="${s[4]}.webp" alt="" style="left:${x}px;top:${y}px;--w:${w}px;--a:${a}deg;--c:${T[s[2]]};--d:${i*.1}s">`+(x<300?`<span class="btag u" style="left:${x+10}px;top:${y+w-14}px;--a:${-a/3}deg;--c:${T[s[2]]};--d:${i*.1}s">${s[0]} ${s[3]}<i>${s[2]}</i></span>`:'')}).join('');
if(v===9||v===10){art=`<div class="panel" aria-hidden="true"></div><div class="rays" aria-hidden="true"></div><div class="dots" aria-hidden="true"></div><div class="rcwrap">${rc}${finFly()}</div>`;}
if(v===11){const rows=SIX.map(s=>`<div class="pl" style="--c:${T[s[2]]};--r:${s[3]};--len:max(130px,calc(${Math.round((s[3]-40)/60*100)}% - 110px))"><div class="lab"><img src="${s[4]}.webp" alt="" style="width:36px;height:36px;object-fit:contain"><div class="n">${s[0]}<small>${s[1]}</small></div><span class="t">${s[2]}</span></div><div class="bar" role="img" aria-label="${s[0]}, Rating ${s[3]}"><span class="r u">${s[3]}</span><img src="${s[4]}.webp" alt=""></div></div>`).join('');
 art=`<div class="panel" aria-hidden="true"></div><div class="rays" aria-hidden="true"></div><div class="dots" aria-hidden="true"></div><div class="pr"><div class="paper"></div><div class="hd"><span class="u">NastyPlot</span><span style="float:right;font:700 13px/2 I;letter-spacing:.06em">RECEIPT</span><small>Winning team · Alpensee Tour (Reg M-C) #85 · Nov 25 · 128 players</small></div>${rows}<div class="ft"><div class="u" style="font-size:17px">Strength Score<br><span style="color:var(--plott)">Tournament ready</span></div><div class="u big">87<small>/100</small></div><div class="stamp u">Reg M-D · Dec 2</div></div><div class="scale" aria-hidden="true"><span>Rating 40</span><span>70</span><span>100</span></div></div>`;}
document.getElementById('hero').innerHTML=words+art;
</script>
</body>
