<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NastyPlot</title>
<meta name="description" content="NastyPlot: Pokémon Champions team builder, ratings, matchups and damage calc built from real tournament results. Sharply raise your win rate.">
<!--NP-ICONS: the build puts src/v2/icons.html here (the "Sly Devil" browser-tab and home-screen icons, Nov 16; the old three are in git history)-->
<!--NP-FONTS: the build puts src/v2/fonts/fonts.css here (fonts hosted by NastyPlot itself, Sim, Nov 11)-->
<script>/* theme before first paint: the saved choice (or today's site's cc2.theme), else the device's. Code review B11: the device's
   setting is read even when storage is blocked, and with no saved choice the page follows the device when it switches */(function(){var t=null,d=document.documentElement,m=null;try{t=localStorage.getItem('np2.theme');if(!t){var o=localStorage.getItem('cc2.theme');t=o==='"dark"'?'night':o==='"light"'?'day':null}}catch(e){}
try{m=matchMedia('(prefers-color-scheme: dark)')}catch(e){}var dev=function(){return m&&m.matches?'night':'day'};d.dataset.theme=t==='night'||t==='day'?t:dev();d.dataset.look=d.dataset.theme==='night'?'dark':'light';
if(!(t==='night'||t==='day')&&m&&m.addEventListener)m.addEventListener('change',function(){var s=null;try{s=localStorage.getItem('np2.theme')}catch(e){}if(s)return;d.dataset.theme=dev();d.dataset.look=d.dataset.theme==='night'?'dark':'light'})})()</script>
