name: Practice deploy (hidden copy, never nastyplot.org)
# Sim, Fri Nov 27: launch Sun Nov 30. Before DEPLOY_ENABLED is switched on, this puts the same site folder deploy.yml would build on a
# SEPARATE Worker, "nastyplot-practice", at its own *.workers.dev address (never nastyplot.org, never the "nastyplot" Worker), runs the
# same smoke checks against it, then deletes it again (unless "keep" is ticked, so Sim can click around; it still sends noindex).
# By hand only (Actions > this workflow > Run workflow). Needs the same secret/variable as deploy.yml: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# It shares the feedback D1 table with the real site (same binding): the checks below only read; nothing posts feedback.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit to build (default: live, what deploy.yml would ship)'
        default: 'live'
      keep:
        description: 'Keep the practice copy up after the checks (delete it later by running again without this)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: practice-deploy
  cancel-in-progress: false
jobs:
  practice:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Install wrangler (no key in this step)
        run: npm i --no-save --no-package-lock --prefix "$RUNNER_TEMP/wr" wrangler@4.45.0 && echo "WR=$RUNNER_TEMP/wr/node_modules/.bin/wrangler" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build the site folder (exactly as deploy.yml does)
        run: |
          npm ci && npx playwright install --with-deps chromium
          node public-site.mjs site
        env:
          CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
      - name: Practice config (separate Worker on workers.dev; no routes; noindex on every answer)
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::variable CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          sed -e '0,/^name = /s#^name = .*#name = "nastyplot-practice"#' -e 's#^directory = .*#directory = "./site"#' \
              -e 's#^workers_dev = .*#workers_dev = true#' -e '/^\[triggers\]/,/^crons/d' -e '/^routes = /d' wrangler.toml > wrangler.practice.toml
          printf '\n/*\n  X-Robots-Tag: noindex, nofollow\n' >> site/_headers
          grep -n '^name\|^workers_dev\|^directory\|crons\|^routes' wrangler.practice.toml; ! grep -q '^routes' wrangler.practice.toml
      - name: Deploy the practice copy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN secret is missing"; exit 1; }
          # no --message: wrangler 4.45 deploy rejects it ("Unknown argument: message"; first practice run, Nov 27)
          "$WR" deploy -c wrangler.practice.toml 2>&1 | tee deploy.log
          test "${PIPESTATUS[0]}" = 0 || { echo "::error::wrangler deploy failed"; exit 1; }
          url=$(grep -oE 'https://nastyplot-practice\.[a-z0-9-]+\.workers\.dev' deploy.log | head -1)
          test -n "$url" || { echo "::error::no workers.dev address in the deploy output (is the account's workers.dev subdomain set up?)"; exit 1; }
          echo "PRACTICE=$url" >> "$GITHUB_ENV"; echo "### Practice copy: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke checks (the same as deploy.yml, against the practice copy)
        run: |
          sleep 20; bad=0
          chk() { got=$(curl -s -o /tmp/body -w '%{http_code}' "$PRACTICE$1"); if [ "$got" != "$2" ] || ! grep -q -- "$3" /tmp/body; then echo "::error::$1 answered $got (want $2 with '$3')"; bad=1; else echo "ok $1 $got"; fi; }
          chk / 200 'NastyPlot'
          chk /pokemon/garchomp 200 'Garchomp in Pokémon Champions'
          chk /data/model.json 200 '{'
          chk /this-page-does-not-exist 404 'noindex'
          if [ -n "${{ vars.CF_ANALYTICS_TOKEN }}" ]; then curl -s "$PRACTICE/" | grep -q 'cloudflareinsights.com/beacon.min.js' && echo 'ok analytics snippet' || { echo '::error::analytics snippet missing'; bad=1; }; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "$PRACTICE/v2.js.map"); [ "$code" = 404 ] && echo "ok no source map" || { echo "::error::source map is public ($code)"; bad=1; }
          curl -sI "$PRACTICE/" | grep -i 'x-robots-tag' || { echo "::error::practice copy answers without noindex"; bad=1; }
          for p in /meta /team /build /pokemon /sitemap.xml /robots.txt; do code=$(curl -s -o /dev/null -w '%{http_code}' "$PRACTICE$p"); echo "$p $code"; [ "$code" = 200 ] || bad=1; done
          exit $bad
      - name: Delete the practice copy
        if: ${{ always() && !inputs.keep }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # Not 'wrangler delete': it first lists KV namespaces, which this token may not read (first good practice run, Nov 27:
        # 'Authentication error [code: 10000]' on /storage/kv/namespaces). The Workers API delete needs only Workers Scripts Edit.
        run: |
          code=$(curl -s -o /tmp/del.json -w '%{http_code}' -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/nastyplot-practice?force=true")
          echo "delete: HTTP $code $(head -c 300 /tmp/del.json)"; [ "$code" = 200 ] || [ "$code" = 404 ] || echo "::warning::practice copy not deleted (HTTP $code); delete nastyplot-practice in the Cloudflare dashboard"
