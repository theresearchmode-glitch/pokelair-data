name: Update Limitless data
on:
  schedule:
    - cron: '7 9 * * *'   # daily, about 5:07 AM New York time in summer, 4:07 AM in winter (GitHub can start it up to an hour late), before NastyPlot's 6:52 refresh
  workflow_dispatch:
permissions:
  contents: write   # commit the day's data
  issues: write     # open, refresh or close the one "Daily data problem" issue (last step)
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # which regulation the newest events are played under (out/reg.json): every step below counts only that regulation
      - run: node reg.mjs || node skip.mjs "regulation check skipped"
      - run: node replays.mjs || node skip.mjs "replays skipped"   # first, so today's bring/lead rates reach the ratings (was a day behind)
      # team preview practice: a few hundred real games and what strong players brought (out/practice.json, page key meta/practice)
      - run: node practice.mjs || node skip.mjs "practice skipped"
      - run: node update.mjs
        env:
          MAX_FETCH: ${{ github.event_name == 'workflow_dispatch' && '400' || '40' }}
      # Official events (Reg M-C Regionals/Internationals, Masters top 64 open team sheets): Victory Road's event pages and
      # VR Pastes, checked against Liquipedia's API. Polite: one request a second per site, our User-Agent, only new or
      # edited events, every paste read once. If anything fails or disagrees with yesterday's file, out/official.json is kept.
      # (RK9 was read here until Nov 1; its terms, rk9.gg/terms 5.3, forbid automated extraction, so rk9.mjs and
      # rk9-field.mjs were removed. The whole-field table they made is kept frozen in out/official_perf.json.)
      - run: node official.mjs || node skip.mjs "official events skipped (previous out/official.json kept)"
      - run: node events.mjs || node skip.mjs "events skipped"
      # this week vs last week from the team sheets already on disk (out/weekly.json; no network)
      - run: node weekly.mjs || node skip.mjs "weekly digest skipped"
      # upcoming official VGC events from Victory Road's season calendar (out/calendar.json; keeps yesterday's file on failure)
      - run: node calendar.mjs || node skip.mjs "calendar skipped"
      - run: node model.mjs || node skip.mjs "model skipped"
      - run: node ladder.mjs || node skip.mjs "ladder stats skipped"
      # other sites' numbers: Showdowntier, Pikalytics (rating inputs, tier lists, cross-check)
      - run: node sources.mjs || node skip.mjs "outside sources skipped"
      - run: (npm install --no-save --no-package-lock playwright@1.49.1 && npx playwright install --with-deps chromium && node opgg.mjs) || node skip.mjs "op.gg skipped"
      # the ratings' daily inputs (all of out/perf.json) for the morning refresh; checked by health.mjs
      - run: node perf.mjs || node skip.mjs "perf skipped"
      # our numbers against the outside sources (out/crosscheck.json; summary and warnings in the Data health step)
      - run: node crosscheck.mjs || node skip.mjs "crosscheck skipped"
      - run: node ratings-snapshot.mjs || node skip.mjs "ratings snapshot skipped"
      - run: node scoreboard.mjs || node skip.mjs "scoreboard skipped"
      # the ratings' track record: each saved snapshot against the events played after it (out/track.json, page meta/track)
      - run: node track.mjs || node skip.mjs "track record skipped"
      - name: Commit
        run: |
          git config user.name "pokelair-bot"
          git config user.email "pokelair-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Limitless data $(date -u +%F)"
          # code can change on main while the job runs; replay the data commit on top and retry
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 10; done
          exit 1
      # Data health gate: runs after the commit, so whatever good data the day produced is already saved. It fails the run
      # (GitHub emails the owner about failed runs) when a file the page relies on is missing, broken, or past its age limit
      # (limits in health.mjs: daily sources 2 days, so one flaky day never alerts), and writes a table to the job summary.
      - name: Data health
        id: health
        if: always()
        env:
          HEALTH_REPORT: ${{ runner.temp }}/health.md
        run: node health.mjs
      # One "Daily data problem" issue, reused: opened when the run fails, its text refreshed each failing day (a comment only
      # when the list of problems changes, so a repeat doesn't email again), closed with a note on the first healthy run.
      - name: Daily data problem issue
        if: always()
        uses: actions/github-script@v7
        env:
          HEALTH_REPORT: ${{ runner.temp }}/health.md
          JOB_STATUS: ${{ job.status }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
        with:
          script: |
            const fs = require('fs'), title = 'Daily data problem';
            let report = ''; try { report = fs.readFileSync(process.env.HEALTH_REPORT, 'utf8'); } catch (e) {}
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const healthy = process.env.JOB_STATUS === 'success' && process.env.HEALTH_OUTCOME === 'success';
            const open = (await github.paginate(github.rest.issues.listForRepo, {...context.repo, state: 'open', per_page: 100}))
              .filter(i => !i.pull_request && i.title === title);
            const issue = open[0];
            if (healthy) {
              if (issue) { await github.rest.issues.createComment({...context.repo, issue_number: issue.number, body: `Fixed: today's data check passed. ${run}`});
                await github.rest.issues.update({...context.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed'}); }
              return; }
            const lead = process.env.HEALTH_OUTCOME === 'success' ? `A step of the daily job failed (see the run log), although every data file is still within its age limit.\n\n` : '';
            const body = `${lead}${report || 'The data check did not run; see the run log.'}\n\nLast checked: ${run}`;
            const list = b => (String(b || '').match(/^- .*$/gm) || []).join('\n');
            if (!issue) { await github.rest.issues.create({...context.repo, title, body}); return; }
            const changed = list(issue.body) !== list(body);
            await github.rest.issues.update({...context.repo, issue_number: issue.number, body});
            if (changed) await github.rest.issues.createComment({...context.repo, issue_number: issue.number, body: `The list of problems changed today. ${run}`});
