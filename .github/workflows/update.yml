name: Update Limitless data
on:
  schedule:
    - cron: '7 9 * * *'   # daily, about 5:07 AM New York time in summer, 4:07 AM in winter (GitHub can start it up to an hour late), before NastyPlot's 6:52 refresh
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node replays.mjs || echo "::warning::replays skipped"   # first, so today's bring/lead rates reach the ratings (was a day behind)
      - run: node update.mjs
        env:
          MAX_FETCH: ${{ github.event_name == 'workflow_dispatch' && '400' || '40' }}
      - run: node rk9.mjs || echo "::warning::rk9 skipped"
      - run: node events.mjs || echo "::warning::events skipped"
      - run: node model.mjs || echo "::warning::model skipped"
      - run: node ladder.mjs || echo "::warning::ladder stats skipped"
      - run: (npm install --no-save --no-package-lock playwright@1.49.1 && npx playwright install --with-deps chromium && node opgg.mjs) || echo "::warning::op.gg skipped"
      # the ratings' daily inputs (tournament table + in-game order) for the morning refresh; checked by health.mjs
      - run: node perf.mjs || echo "::warning::perf skipped"
      - run: node ratings-snapshot.mjs || echo "::warning::ratings snapshot skipped"
      - run: node scoreboard.mjs || echo "::warning::scoreboard skipped"
      - name: Commit
        run: |
          git config user.name "pokelair-bot"
          git config user.email "pokelair-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Limitless data $(date -u +%F)"
          # code can change on main while the job runs; replay the data commit on top and retry
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 10; done
          exit 1
      - name: Data health
        run: node health.mjs
