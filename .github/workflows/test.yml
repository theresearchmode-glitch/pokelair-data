name: Test PokéLair page
on:
  push:
    paths: ['app/**']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node app/test/run.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: page
          path: app/dist/page.html
