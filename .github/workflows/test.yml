name: Test NastyPlot page
on:
  push:
    # page code, plus the data and model the page reads (a bad day of data can break it too), plus the replay parser
    paths: ['app/**', 'out/**', 'model.mjs', 'pilot.mjs', 'replays.mjs', 'official.mjs', 'experiments/replays-test.mjs', 'experiments/post-data-test.mjs', 'experiments/post-news-test.mjs', 'post-news.mjs', 'experiments/*-check.mjs', 'experiments/suggest-audit.mjs', 'experiments/lead-logic.mjs', 'experiments/sync-logic.mjs', 'experiments/typing-sync.mjs', 'experiments/sync-quiet.mjs', 'experiments/build-logic.mjs', 'experiments/fields-audit.mjs', 'experiments/suggest-gaps.mjs', 'experiments/build-logic.mjs', 'experiments/gen-move-meta.mjs', 'experiments/golden.mjs', 'experiments/accuracy-gate.mjs', 'experiments/accuracy-baseline.json', 'experiments/walk-forward.mjs', 'experiments/board.mjs', 'experiments/same-grade.mjs', 'experiments/plan-cache-test.mjs', '.github/workflows/test.yml', 'package.json', 'package-lock.json']
  workflow_dispatch:
  # Nov 9: commits made by GitHub's own jobs (the daily data, the weekly re-check, the monthly check) never trigger a push run
  # (GitHub rule for its built-in token), so fresh data was never tested and the live branch could not move. Start the tests
  # when those jobs finish; this route is allowed. It tests main as it stands then (the newly committed data included).
  workflow_run:
    workflows: ["Update Limitless data", "Weekly settings re-check", "Monthly accuracy check"]
    types: [completed]
    branches: [main]
# Changes land as a few commits in a row; only the newest one is tested. An older run still going is cancelled
# (cancelled runs send no failure email), so a half-uploaded change can't trigger a false alarm.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The new site's behaviour tests (code review C-C1, Nov 17): one job per group, since a full run is ~40 min, over one job's limit.
  # Each runs on the test fixture; a failure on known-v2.json (each with its reason) is reported as "known"; any other failure fails.
  behaviour-v2:
    name: new site behaviour (${{ matrix.group }})
    # Sim, Nov 18 (Q6 A): the daily data run (workflow_run) skips this frozen-data new-site job, so a flake here can't hold back the
    # day's data; every code push still runs it and it still blocks there. Today's data on the new site is checked by v2-today (data-checks).
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        group: [A-team, B-build, C-battle, D-meta-shell]
    steps:
      - name: Wait for the rest of a multi-commit change
        run: sleep 120
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci && npx playwright install --with-deps chromium
      - run: node app/build.mjs --v2 --art=../src/v2/art/
      - run: PAGE=app/dist/v2.html ADAPTER=v2 node app/test/behaviour/run.mjs ${{ matrix.group }}
      # the kit's taps tap once, also when the page is slow to answer (Nov 19, EDIT-03 on a loaded machine)
      - if: ${{ !cancelled() && matrix.group == 'A-team' }}
        run: PAGE=app/dist/v2.html ADAPTER=v2 node app/test/behaviour/tap-once.mjs
  # Safari's engine (code review C-I8, Nov 17: Sim tests on iPhone and iPad; the suites ran in Chromium only). The My Team group
  # on WebKit. Reported, not blocking yet. SUG-05 (Nov 18): failed 4 of 5 here; the test read the 4 s toast after a settle
  # that ran past it in WebKit; it now reads the Undo while the toast is up (5 of 5 in both engines).
  behaviour-webkit:
    name: new site behaviour in Safari's engine (A-team)
    # Sim, Nov 18 (Q6 A): the daily data run (workflow_run) skips this frozen-data new-site job, so a flake here can't hold back the
    # day's data; every code push still runs it and it still blocks there. Today's data on the new site is checked by v2-today (data-checks).
    if: github.event_name != 'workflow_run'
    # ubuntu-24.04, not -latest: Playwright 1.49.1's WebKit needs libicu74, libvpx9, libxml2, libx264-164, which the newer
    # image doesn't have (first CI run, Nov 17: 'Package libicu74 has no installation candidate')
    runs-on: ubuntu-24.04
    timeout-minutes: 60   # Nov 18: installing WebKit took 20 of the 35 minutes in run 1372, so the test was cut off; alert-only job
    continue-on-error: true
    steps:
      - name: Wait for the rest of a multi-commit change
        run: sleep 120
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # Playwright 1.63 (WebKit 26.6, close to current iPhones) for this job only: the pinned 1.49.1 brings WebKit 18.2, whose Linux
      # build crashed on plain style changes and lost the scroll range after a redraw (Nov 17: X-05, SUG-08, MU-04 failed there,
      # pass on 26.6). chromium too: the build snapshots the static first screen.
      - run: npm ci && npm install --no-save playwright@1.63.0 && npx playwright install --with-deps webkit chromium
      - run: node app/build.mjs --v2 --art=../src/v2/art/
      - run: BROWSER=webkit PAGE=app/dist/v2.html ADAPTER=v2 node app/test/behaviour/run.mjs A-team
      - run: BROWSER=webkit PAGE=app/dist/v2.html ADAPTER=v2 node app/test/behaviour/tap-once.mjs
        if: ${{ !cancelled() }}
  # The full quality check of RULES.md 00q on every page (code review C-I8, Nov 17: it only ran by hand): contained, no text on
  # text, sizes on the scale, tap targets, no code as text; 5 widths, day and night, on the frozen data. Findings already judged
  # are in app/test/qcheck-known.json; any new one fails.
  quality-v2:
    name: new site full quality check (every page and view)
    # Sim, Nov 18 (Q6 A): the daily data run (workflow_run) skips this frozen-data new-site job, so a flake here can't hold back the
    # day's data; every code push still runs it and it still blocks there. Today's data on the new site is checked by v2-today (data-checks).
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 55   # every view added Nov 17: measured 1,693 s here
    steps:
      - name: Wait for the rest of a multi-commit change
        run: sleep 120
      - uses: actions/checkout@v5
      - name: Use the frozen test data
        env:
          TEST_DATA: 0c992f6977bc1cecc4e03eb269969a82b99681cf
        run: |
          git fetch --depth=1 origin $TEST_DATA
          git checkout $TEST_DATA -- out/
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci && npx playwright install --with-deps chromium
      - run: node app/build.mjs --v2 --preview-data
      - run: PAGE=app/dist/v2.html node app/test/qcheck-all.mjs
  # Code tests (Sim, Nov 9, "split the tests"): every check runs on a FROZEN copy of the data (the out/ folder of commit
  # TEST_DATA below: the last data on which everything passed), so red here means the CODE broke, not that today's data
  # changed a result. Change TEST_DATA only on purpose (e.g. a new regulation), to a commit whose data passes every check.
  # Nov 18: the new site's checks moved to their own jobs below (with them this job ran 34-35+ min and was cancelled at its
  # limit in runs 1331-1351, so golden, same-grade and the logic checks never ran). Nothing was dropped: every step still runs.
  test:
    name: code tests (frozen data)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for the rest of a multi-commit change
        run: sleep 120
      - uses: actions/checkout@v5
      - name: Use the frozen test data
        env:
          TEST_DATA: 0c992f6977bc1cecc4e03eb269969a82b99681cf
        run: |
          git fetch --depth=1 origin $TEST_DATA
          git checkout $TEST_DATA -- out/
          echo "code tests run on the out/ data of ${TEST_DATA:0:7}"
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci && npx playwright install --with-deps chromium
      # Showdown's Champions mod with Reg M-C data (pinned GitHub commit; npm 0.11.11 stops at Reg M-B): build it once
      - run: cd node_modules/pokemon-showdown && node build
      - run: node app/test/run.mjs
        if: ${{ !cancelled() }}
      - run: node experiments/replays-test.mjs
        if: ${{ !cancelled() }}
      - run: node experiments/tour-modes-test.mjs
        if: ${{ !cancelled() }}
      # Mystery Gifts and news (app/src/data/post.js): every gift sourced, codes cited, dates parse, start before end, every link https
      - run: node experiments/post-data-test.mjs
        if: ${{ !cancelled() }}
      # the daily news read (post-news.mjs) and its document out/post.json (meta/post): fail safe, https only, no article text, size limit
      - run: node experiments/post-news-test.mjs
        if: ${{ !cancelled() }}
      # mechanics vs Smogon's Champions engine: every stat exact, damage 98.5%+ exact on all 16 rolls
      - run: node experiments/speed-check.mjs
        if: ${{ !cancelled() }}
      - run: node experiments/calc-check.mjs 2000
        if: ${{ !cancelled() }}
      # legality: species / items / stones on the page vs the Reg M-C lists (Watchog settled Oct 28: legal, listed as Patrat)
      - run: node experiments/legality-check.mjs
        if: ${{ !cancelled() }}
      # threat preparation: 42 hand-checked verdicts + damage vs Smogon, support threats, real teams (user's team, regionals)
      - run: node experiments/threat-check.mjs
        if: ${{ !cancelled() }}
      # game-mechanics completeness: every VGC field (accuracy, priority, targets, flags, secondaries, weights…) is in the
      # generated data, matches Showdown's champions mod, and is read by the engine (fails on any gap that changes answers)
      - run: node experiments/fields-audit.mjs
        if: ${{ !cancelled() }}
      # suggestions close the team's own game-plan gaps (e.g. rain for Swift Swim) and never make the game plan worse
      - run: node experiments/suggest-gaps.mjs
        if: ${{ !cancelled() }}
      # suggestions audit (Nov 7): no weather nothing uses, no second weather or terrain, no attacker its own weather weakens,
      # no Psychic Terrain on the team's own priority, no Trick Room without slow attackers, no loops when Apply is tapped again and again
      - run: node experiments/suggest-audit.mjs 30 5
        if: ${{ !cancelled() }}
      # Build for me / Build around it: no clashing weathers, weather users with their setter, no Scarf under own Trick Room, speed control
      - run: node experiments/build-logic.mjs
        if: ${{ !cancelled() }}
      # Battle leads (no two weather or terrain setters, no Psychic Terrain on own Fake Out, no Trick Room + Tailwind) and threat verdicts match real sets
      - run: node experiments/lead-logic.mjs
        if: ${{ !cancelled() }}
      # several devices on one account: live updates, an older device never overwrites a newer box, box links (Nov 7)
      - run: node experiments/sync-logic.mjs
        if: ${{ !cancelled() }}
      # typing in Add a Pokémon while the account sync is busy: the box keeps what you typed; old echoes of your own saves are ignored (Nov 7)
      - run: node experiments/typing-sync.mjs
        if: ${{ !cancelled() }}
      # "Updated from your other device" only when another device really changed something; no back-and-forth saves (Nov 7)
      - run: node experiments/sync-quiet.mjs
        if: ${{ !cancelled() }}
      # Phase 4 (Nov 9): the known-answer teams (top-4 teams with their own sheets, Build for Me, Build around, boxes, Apply = promised)
      - run: node experiments/golden.mjs
        if: ${{ !cancelled() }}
      # Phase 4 (Nov 9): the same team shows the same grade on My Team, Saved Teams, Compare, an event's Load team and Build for Me
      - run: node experiments/same-grade.mjs
        if: ${{ !cancelled() }}
      # behaviour review C4 (Nov 18): the same team with the same sets gets the same suggestions whatever was planned before
      - run: node experiments/plan-cache-test.mjs
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v4
        with:
          name: page
          path: app/dist/page.html
  # The new site's code checks (frozen data), split out of "code tests" on Nov 18 (see there). Same steps, same order.
  v2-checks:
    name: new site code checks (frozen data)
    # Sim, Nov 18 (Q6 A): the daily data run (workflow_run) skips this frozen-data new-site job, so a flake here can't hold back the
    # day's data; every code push still runs it and it still blocks there. Today's data on the new site is checked by v2-today (data-checks).
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for the rest of a multi-commit change
        run: sleep 120
      - uses: actions/checkout@v5
      - name: Use the frozen test data
        env:
          TEST_DATA: 0c992f6977bc1cecc4e03eb269969a82b99681cf
        run: |
          git fetch --depth=1 origin $TEST_DATA
          git checkout $TEST_DATA -- out/
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci && npx playwright install --with-deps chromium
      # the rebuild's guard rails (R3): no !important, no id selectors, type/spacing on the scale, colours only in tokens.css
      - run: node app/test/v2-guard.mjs
        if: ${{ !cancelled() }}
      # privacy (code review C-C2, Nov 17): no real player name in the committed test data or the built Preview page
      - run: node app/test/no-names.mjs && node app/build.mjs --v2 --preview-data && node app/test/no-names.mjs app/dist/v2.html
        if: ${{ !cancelled() }}
      # caches follow nature and stat points (code review A2-I4 + A1-I2): the suggestion baseline and Test Run (needs the --preview-data build above)
      - run: PAGE=app/dist/v2.html node app/test/v2-caches.mjs
        if: ${{ !cancelled() }}
      - run: PAGE=app/dist/v2.html node app/test/v2-folds.mjs
        if: ${{ !cancelled() }}
      - run: PAGE=app/dist/v2.html node app/test/v2-partial.mjs
        if: ${{ !cancelled() }}
      - run: PAGE=app/dist/v2.html node app/test/v2-redraws.mjs
        if: ${{ !cancelled() }}
      - run: PAGE=app/dist/v2.html node app/test/v2-trwarm.mjs
        if: ${{ !cancelled() }}
      - run: PAGE=app/dist/v2.html node app/test/v2-back.mjs
        if: ${{ !cancelled() }}
      - run: PAGE=app/dist/v2.html node app/test/v2-toast.mjs
        if: ${{ !cancelled() }}
      - run: PAGE=app/dist/v2.html node app/test/v2-rmjump.mjs
        if: ${{ !cancelled() }}
      - run: PAGE=app/dist/v2.html node app/test/v2-clear.mjs
        if: ${{ !cancelled() }}
      # form errors reach the field (design review Nov 19 #6): aria-invalid, aria-describedby, focus on Import, Edit Set, Send Feedback
      - run: PAGE=app/dist/v2.html node app/test/v2-formerr.mjs
        if: ${{ !cancelled() }}
      - run: PAGE=app/dist/v2.html node app/test/v2-pksrc.mjs
        if: ${{ !cancelled() }}
      - run: PAGE=app/dist/v2.html node app/test/v2-trkfit.mjs
        if: ${{ !cancelled() }}
      - run: PAGE=app/dist/v2.html node app/test/v2-pbppair.mjs
        if: ${{ !cancelled() }}
      - run: PAGE=app/dist/v2.html node app/test/v2-t1rules.mjs
        if: ${{ !cancelled() }}
      - run: PAGE=app/dist/v2.html node app/test/v2-cxev.mjs
        if: ${{ !cancelled() }}
      - run: PAGE=app/dist/v2.html node app/test/v2-oddaddr.mjs
        if: ${{ !cancelled() }}
      - run: LT_ALERT=1 PAGE=app/dist/v2.html node app/test/v2-longtask.mjs   # the build-then-draw order blocks; the timing part only alerts (shared runners)
        if: ${{ !cancelled() }}
      # News and Mystery Gifts read the daily document meta/post (Nov 18): a headline only in it shows, none or a broken one falls back to post.js
      - run: PAGE=app/dist/v2.html node app/test/v2-post-doc.mjs
        if: ${{ !cancelled() }}
      - run: PAGE=app/dist/v2.html node app/test/v2-unbounded.mjs
        if: ${{ !cancelled() }}
      - run: PAGE=app/dist/v2.html node app/test/v2-sixof.mjs
        if: ${{ !cancelled() }}
      - run: PAGE=app/dist/v2.html node app/test/v2-shown-score.mjs
        if: ${{ !cancelled() }}
      - run: PAGE=app/dist/v2.html node app/test/v2-ckwin.mjs
        if: ${{ !cancelled() }}
      - run: PAGE=app/dist/v2.html node app/test/v2-paste.mjs
        if: ${{ !cancelled() }}
      # Team Card / Poster: a long name's lines are spaced by the size they are drawn at (review FP-5)
      - run: PAGE=app/dist/v2.html node app/test/share-fz.mjs
        if: ${{ !cancelled() }}
      # pre-launch check 1 (Nov 17): no page draws the built-in numbers and then swaps to today's (data store answers 1.2 s late)
      - run: PAGE=app/dist/v2.html node app/test/data-swap.mjs
        if: ${{ !cancelled() }}
      # pre-launch check 5c (Nov 17): forms-strip labels read at 4.5:1 or more, day and night
      - run: PAGE=app/dist/v2.html node app/test/forms-contrast.mjs
        if: ${{ !cancelled() }}
      # pre-launch check 5a (Nov 17): standalone text links at least 24px tall
      - run: PAGE=app/dist/v2.html node app/test/tap-size.mjs
        if: ${{ !cancelled() }}
      - run: node app/test/tokens-doc.mjs
        if: ${{ !cancelled() }}
      - run: node app/test/perf-docs.mjs
        if: ${{ !cancelled() }}
      - run: node app/test/test-ids.mjs
        if: ${{ !cancelled() }}
      # the --split Preview's loaders over http (review Nov 18 C5, C6): a missing preview.json or v2.js says so (builds its own; the steps after rebuild)
      - run: node app/build.mjs --v2 --preview-data --split && node app/test/v2-split.mjs
        if: ${{ !cancelled() }}
      - run: node app/test/v2-public.mjs   # last of the v2 steps: it leaves dist/v2.html as the public build
        if: ${{ !cancelled() }}
      # the new site never says "Ready for" / "N% ready" (word list: Matchups; Sim, Nov 12): reads every built page, fold, sheet and "?"
      - run: node app/build.mjs --v2 && node experiments/v2-words.mjs
        if: ${{ !cancelled() }}
  # v2-minors (the small fixes' checks, 18-21 min in one go) as three parallel parts; each runs its share once (PART in the file's header).
  v2-minors:
    name: new site small checks (v2-minors ${{ matrix.part }})
    # Sim, Nov 18 (Q6 A): the daily data run (workflow_run) skips this frozen-data new-site job, so a flake here can't hold back the
    # day's data; every code push still runs it and it still blocks there. Today's data on the new site is checked by v2-today (data-checks).
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        part: [main1, main2, groups]
    steps:
      - name: Wait for the rest of a multi-commit change
        run: sleep 120
      - uses: actions/checkout@v5
      - name: Use the frozen test data
        env:
          TEST_DATA: 0c992f6977bc1cecc4e03eb269969a82b99681cf
        run: |
          git fetch --depth=1 origin $TEST_DATA
          git checkout $TEST_DATA -- out/
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci && npx playwright install --with-deps chromium
      - run: node app/build.mjs --v2 --preview-data
      - run: PART=${{ matrix.part }} PAGE=app/dist/v2.html node app/test/v2-minors.mjs
  # Data checks (Sim, Nov 9): the checks that judge results, run on TODAY's data. Red here means today's data changed a
  # result (Nov 9: complete sets flipped a Pelipper verdict, a lead and the grade checks). Still blocks the live branch.
  data-checks:
    name: data checks (today's data)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for the rest of a multi-commit change
        run: sleep 120
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci && npx playwright install --with-deps chromium
      - run: cd node_modules/pokemon-showdown && node build
      - run: node app/build.mjs
      - run: node app/test/run.mjs
        if: ${{ !cancelled() }}
      - run: node experiments/threat-check.mjs
        if: ${{ !cancelled() }}
      - run: node experiments/lead-logic.mjs
        if: ${{ !cancelled() }}
      - run: node experiments/golden.mjs
        if: ${{ !cancelled() }}
      # the new site on today's data (switch readiness Tests 3, Nov 18): built as it goes live (--v2 --public --split), its data store
      # answered with today's documents stored as the refresh stores them; every main route opened: no errors, no empty or no-data
      # page, no NaN text, Strength Score 0-100, ratings filled, every picture loads. About 30 s.
      - run: node app/test/v2-today.mjs
        if: ${{ !cancelled() }}
  # Live-data audits (Sim, Nov 18: "make sure we have holes like this in our rules and logic covered well and dont need to wait till
  # later to be uncovered"). The code tests run these audits on frozen Nov 9 data only, so holes that only today's teams show stayed
  # hidden (Symbiosis since Nov 16, a Perish Trap Politoed on Nov 18). This job runs them on today's data as an ALERT: it never
  # fails the workflow (so it never holds back the live site); it opens or refreshes one "Live-data audit" issue, closed when clean.
  live-audits:
    name: live-data audits (alert only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.49.1 @smogon/calc@0.12.0 @pkmn/dex@0.10.11 github:smogon/pokemon-showdown#1242c1e2d9763ba5b85d33f13aecb89bae19ae3d && npx playwright install --with-deps chromium
      - run: cd node_modules/pokemon-showdown && node build
      - run: node app/build.mjs
      - name: Audits on today's data
        id: audits
        run: |
          set +e; R="$RUNNER_TEMP/audits.md"; : > "$R"; bad=0
          for c in "experiments/suggest-audit.mjs 30 5" "experiments/fields-audit.mjs" "experiments/suggest-gaps.mjs"; do
            out=$(node $c 2>&1); code=$?
            if [ $code -ne 0 ]; then bad=1; { echo "### node $c (exit $code)"; echo '```'; echo "$out" | grep -v "^ *note:" | grep -E "FAIL|never reads|not listed" | head -20; echo '```'; } >> "$R"; fi
          done
          echo "bad=$bad" >> "$GITHUB_OUTPUT"
      - name: Live-data audit issue
        if: always()
        uses: actions/github-script@v8
        env:
          REPORT: ${{ runner.temp }}/audits.md
          BAD: ${{ steps.audits.outputs.bad }}
        with:
          script: |
            const fs = require('fs'), title = 'Live-data audit';
            let report = ''; try { report = fs.readFileSync(process.env.REPORT, 'utf8'); } catch (e) {}
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = (await github.rest.issues.listForRepo({...context.repo, state: 'open', per_page: 100})).data.find(i => i.title === title && !i.pull_request);
            if (process.env.BAD === '1') {
              const body = `Today's data shows rule or logic gaps the frozen-data tests can't see. The live site is NOT held back by this.\n\nRun: ${run}\n\n${report}`;
              if (open) await github.rest.issues.update({...context.repo, issue_number: open.number, body});
              else await github.rest.issues.create({...context.repo, title, body});
            } else if (open) {
              await github.rest.issues.createComment({...context.repo, issue_number: open.number, body: `Clean on ${run}`});
              await github.rest.issues.update({...context.repo, issue_number: open.number, state: 'closed'});
            }
  # Never-get-worse gate (Accuracy Lab, Nov 9, Sim approved): the last 2 walk-forward weeks before the sealed set, each scored
  # by a model trained only on earlier events, against the approved baseline (experiments/accuracy-baseline.json). Its own job,
  # so training the two models can't push the main test job past its time limit.
  accuracy-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Wait for the rest of a multi-commit change
        run: sleep 120
      - uses: actions/checkout@v5
