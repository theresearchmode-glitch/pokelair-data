name: Test NastyPlot page
on:
  push:
    # page code, plus the data and model the page reads (a bad day of data can break it too), plus the replay parser
    paths: ['app/**', 'out/**', 'model.mjs', 'pilot.mjs', 'replays.mjs', 'official.mjs', 'experiments/replays-test.mjs', 'experiments/*-check.mjs', 'experiments/suggest-audit.mjs', 'experiments/lead-logic.mjs', 'experiments/sync-logic.mjs', 'experiments/typing-sync.mjs', 'experiments/sync-quiet.mjs', 'experiments/build-logic.mjs', 'experiments/fields-audit.mjs', 'experiments/suggest-gaps.mjs', 'experiments/build-logic.mjs', 'experiments/gen-move-meta.mjs', 'experiments/golden.mjs', 'experiments/accuracy-gate.mjs', 'experiments/accuracy-baseline.json', 'experiments/walk-forward.mjs', 'experiments/board.mjs', 'experiments/same-grade.mjs', '.github/workflows/test.yml']
  workflow_dispatch:
  # Nov 9: commits made by GitHub's own jobs (the daily data, the weekly re-check, the monthly check) never trigger a push run
  # (GitHub rule for its built-in token), so fresh data was never tested and the live branch could not move. Start the tests
  # when those jobs finish; this route is allowed. It tests main as it stands then (the newly committed data included).
  workflow_run:
    workflows: ["Update Limitless data", "Weekly settings re-check", "Monthly accuracy check"]
    types: [completed]
    branches: [main]
# Changes land as a few commits in a row; only the newest one is tested. An older run still going is cancelled
# (cancelled runs send no failure email), so a half-uploaded change can't trigger a false alarm.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Code tests (Sim, Nov 9, "split the tests"): every check runs on a FROZEN copy of the data (the out/ folder of commit
  # TEST_DATA below: the last data on which everything passed), so red here means the CODE broke, not that today's data
  # changed a result. Change TEST_DATA only on purpose (e.g. a new regulation), to a commit whose data passes every check.
  test:
    name: code tests (frozen data)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for the rest of a multi-commit change
        run: sleep 120
      - uses: actions/checkout@v5
      - name: Use the frozen test data
        env:
          TEST_DATA: 0c992f6977bc1cecc4e03eb269969a82b99681cf
        run: |
          git fetch --depth=1 origin $TEST_DATA
          git checkout $TEST_DATA -- out/
          echo "code tests run on the out/ data of ${TEST_DATA:0:7}"
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.49.1 @smogon/calc@0.12.0 @pkmn/dex@0.10.11 github:smogon/pokemon-showdown#1242c1e2d9763ba5b85d33f13aecb89bae19ae3d && npx playwright install --with-deps chromium
      # Showdown's Champions mod with Reg M-C data (pinned GitHub commit; npm 0.11.11 stops at Reg M-B): build it once
      - run: cd node_modules/pokemon-showdown && node build
      - run: node app/test/run.mjs
        if: ${{ !cancelled() }}
      # the rebuild's guard rails (R3): no !important, no id selectors, type/spacing on the scale, colours only in tokens.css
      - run: node app/test/v2-guard.mjs
        if: ${{ !cancelled() }}
      # the new site never says "Ready for" / "N% ready" (word list: Matchups; Sim, Nov 12): reads every built page, fold, sheet and "?"
      - run: node app/build.mjs --v2 && node experiments/v2-words.mjs
        if: ${{ !cancelled() }}
      - run: node experiments/replays-test.mjs
        if: ${{ !cancelled() }}
      # mechanics vs Smogon's Champions engine: every stat exact, damage 98.5%+ exact on all 16 rolls
      - run: node experiments/speed-check.mjs
        if: ${{ !cancelled() }}
      - run: node experiments/calc-check.mjs 2000
        if: ${{ !cancelled() }}
      # legality: species / items / stones on the page vs the Reg M-C lists (Watchog settled Oct 28: legal, listed as Patrat)
      - run: node experiments/legality-check.mjs
        if: ${{ !cancelled() }}
      # threat preparation: 42 hand-checked verdicts + damage vs Smogon, support threats, real teams (user's team, regionals)
      - run: node experiments/threat-check.mjs
        if: ${{ !cancelled() }}
      # game-mechanics completeness: every VGC field (accuracy, priority, targets, flags, secondaries, weights…) is in the
      # generated data, matches Showdown's champions mod, and is read by the engine (fails on any gap that changes answers)
      - run: node experiments/fields-audit.mjs
        if: ${{ !cancelled() }}
      # suggestions close the team's own game-plan gaps (e.g. rain for Swift Swim) and never make the game plan worse
      - run: node experiments/suggest-gaps.mjs
        if: ${{ !cancelled() }}
      # suggestions audit (Nov 7): no weather nothing uses, no second weather or terrain, no attacker its own weather weakens,
      # no Psychic Terrain on the team's own priority, no Trick Room without slow attackers, no loops when Apply is tapped again and again
      - run: node experiments/suggest-audit.mjs 30 5
        if: ${{ !cancelled() }}
      # Build for me / Build around it: no clashing weathers, weather users with their setter, no Scarf under own Trick Room, speed control
      - run: node experiments/build-logic.mjs
        if: ${{ !cancelled() }}
      # Battle leads (no two weather or terrain setters, no Psychic Terrain on own Fake Out, no Trick Room + Tailwind) and threat verdicts match real sets
      - run: node experiments/lead-logic.mjs
        if: ${{ !cancelled() }}
      # several devices on one account: live updates, an older device never overwrites a newer box, box links (Nov 7)
      - run: node experiments/sync-logic.mjs
        if: ${{ !cancelled() }}
      # typing in Add a Pokémon while the account sync is busy: the box keeps what you typed; old echoes of your own saves are ignored (Nov 7)
      - run: node experiments/typing-sync.mjs
        if: ${{ !cancelled() }}
      # "Updated from your other device" only when another device really changed something; no back-and-forth saves (Nov 7)
      - run: node experiments/sync-quiet.mjs
        if: ${{ !cancelled() }}
      # Phase 4 (Nov 9): the known-answer teams (top-4 teams with their own sheets, Build for Me, Build around, boxes, Apply = promised)
      - run: node experiments/golden.mjs
        if: ${{ !cancelled() }}
      # Phase 4 (Nov 9): the same team shows the same grade on My Team, Saved Teams, Compare, an event's Load team and Build for Me
      - run: node experiments/same-grade.mjs
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v4
        with:
          name: page
          path: app/dist/page.html
  # Data checks (Sim, Nov 9): the checks that judge results, run on TODAY's data. Red here means today's data changed a
  # result (Nov 9: complete sets flipped a Pelipper verdict, a lead and the grade checks). Still blocks the live branch.
  data-checks:
    name: data checks (today's data)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for the rest of a multi-commit change
        run: sleep 120
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.49.1 @smogon/calc@0.12.0 @pkmn/dex@0.10.11 github:smogon/pokemon-showdown#1242c1e2d9763ba5b85d33f13aecb89bae19ae3d && npx playwright install --with-deps chromium
      - run: cd node_modules/pokemon-showdown && node build
      - run: node app/build.mjs
      - run: node app/test/run.mjs
        if: ${{ !cancelled() }}
      - run: node experiments/threat-check.mjs
        if: ${{ !cancelled() }}
      - run: node experiments/lead-logic.mjs
        if: ${{ !cancelled() }}
      - run: node experiments/golden.mjs
        if: ${{ !cancelled() }}
  # Never-get-worse gate (Accuracy Lab, Nov 9, Sim approved): the last 2 walk-forward weeks before the sealed set, each scored
  # by a model trained only on earlier events, against the approved baseline (experiments/accuracy-baseline.json). Its own job,
  # so training the two models can't push the main test job past its time limit.
  accuracy-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Wait for the rest of a multi-commit change
        run: sleep 120
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node app/build.mjs
      - run: node experiments/accuracy-gate.mjs
